<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1e2b">
  <title>رأس إنسان ثلاثي الأبعاد</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      color: #eaeef5;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: radial-gradient(ellipse at 50% 36%, #343b51 0%, #252b3b 46%, #171b26 100%);
    }
    .scene {
      width: 100%;
      max-width: 700px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
    }
    .face-container {
      position: relative;
      width: min(420px, 88vw);
      height: min(500px, 64vh);
      min-height: 360px;
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      filter: drop-shadow(0 30px 30px rgba(0,0,0,.34));
    }
    .face-container:active { cursor: grabbing; }
    .face-container canvas { display: block; width: 100%; height: 100%; outline: none; }
    .controls {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      padding: 13px 20px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 60px;
      background: rgba(20,24,33,.72);
      box-shadow: 0 15px 35px rgba(0,0,0,.36);
      backdrop-filter: blur(10px);
    }
    .controls button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 40px;
      color: #eaeef5;
      background: rgba(255,255,255,.08);
      box-shadow: 0 4px 10px rgba(0,0,0,.22);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s, transform .2s, border-color .2s;
    }
    .controls button:hover { background: rgba(255,255,255,.18); transform: scale(1.03); border-color: rgba(255,255,255,.3); }
    .controls button:active { transform: scale(.98); }
    .controls button i { font-style: normal; font-size: 1.2rem; }
    .upload-section {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 40px;
      background: rgba(20,24,33,.72);
      box-shadow: 0 10px 25px rgba(0,0,0,.3);
      backdrop-filter: blur(10px);
    }
    .upload-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 40px;
      color: white;
      background: linear-gradient(135deg,#6a5acd,#8a7bdd);
      box-shadow: 0 4px 15px rgba(106,90,205,.38);
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }
    .upload-label.side {
      background: linear-gradient(135deg,#4a7a6a,#6aa08d);
      box-shadow: 0 4px 15px rgba(74,122,106,.38);
    }
    .upload-label:hover { transform: translateY(-2px); }
    .upload-label input { display: none; }
    .upload-status {
      font-size: .75rem;
      color: #9ba3b0;
      min-width: 60px;
      text-align: center;
    }
    .upload-status.ready { color: #7ed4a8; }
    .hint {
      max-width: min(580px, 92vw);
      margin-top: 14px;
      padding: 9px 17px;
      border-radius: 30px;
      color: #b0b8c5;
      background: rgba(0,0,0,.26);
      font-size: .82rem;
      line-height: 1.6;
      text-align: center;
    }
    .status { min-height: 1.3em; margin-top: 6px; color: #d4d9e2; font-size: .8rem; text-align: center; }
    @media (max-width: 480px) {
      body { padding: 12px; }
      .face-container { height: min(460px, 59vh); min-height: 330px; }
      .controls { gap: 8px; padding: 10px 12px; }
      .controls button { padding: 9px 13px; font-size: .9rem; }
      .upload-label { padding: 9px 15px; font-size: .82rem; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="عارض رأس إنسان ثلاثي الأبعاد">
    <div class="face-container" id="faceContainer" role="img" aria-label="رأس ثلاثي الأبعاد قابل للدوران"></div>
  </main>

  <nav class="controls" aria-label="أدوات تدوير الرأس">
    <button id="leftBtn" title="تحريك لليسار"><i>←</i> يسار</button>
    <button id="upBtn" title="إمالة الرأس"><i>↑</i> أعلى</button>
    <button id="rightBtn" title="تحريك لليمين"><i>→</i> يمين</button>
    <button id="resetBtn" title="إعادة تعيين"><i>⟲</i> إعادة</button>
  </nav>

  <section class="upload-section" aria-label="رفع الصور">
    <label class="upload-label" for="faceUpload">
      <span aria-hidden="true">🙂</span> صورة الوجه الأمامي
      <input type="file" id="faceUpload" accept="image/*">
    </label>
    <span class="upload-status" id="faceStatus">لم تُرفع</span>

    <label class="upload-label side" for="sideUpload">
      <span aria-hidden="true">💇</span> صورة الجانب / الشعر
      <input type="file" id="sideUpload" accept="image/*">
    </label>
    <span class="upload-status" id="sideStatus">لم تُرفع</span>
  </section>

  <p class="hint">
    💡 ارفع صورتين مفرغتين (PNG شفافة). الصورتان تُدمجان على سطح واحد ليكونا امتداداً لبعضهما.
  </p>
  <p class="status" id="status" aria-live="polite"></p>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';

    const container = document.getElementById('faceContainer');
    const faceUpload = document.getElementById('faceUpload');
    const sideUpload = document.getElementById('sideUpload');
    const faceStatus = document.getElementById('faceStatus');
    const sideStatus = document.getElementById('sideStatus');
    const status = document.getElementById('status');

    // ============================================================
    // المشهد
    // ============================================================
    const scene = new THREE.Scene();
    scene.background = null;

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 50);
    camera.position.set(0, 0.05, 5.6);

    scene.add(new THREE.HemisphereLight(0xe5edff, 0x453326, 2.0));

    const keyLight = new THREE.DirectionalLight(0xffe2ca, 2.6);
    keyLight.position.set(-3.5, 4.5, 5.0);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xc6d5ff, 1.2);
    fillLight.position.set(4.0, 1.0, 3.0);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffcda9, 1.6);
    rimLight.position.set(1.5, 3.0, -3.0);
    scene.add(rimLight);

    const headGroup = new THREE.Group();
    scene.add(headGroup);

    // ============================================================
    // ✅ مجسم واحد فقط — لا طبقات متراكبة
    // ============================================================
    const HEAD_W = 1.55;
    const HEAD_H = 2.0;
    const HEAD_D = 1.15;

    function makeHeadGeometry() {
      const around = 128;
      const vertical = 160;

      const positions = [];
      const uvs = [];
      const indices = [];

      const rx = HEAD_W / 2;
      const rz = HEAD_D / 2;
      const ry = HEAD_H / 2;

      for (let j = 0; j <= vertical; j++) {
        const v = j / vertical;
        const y = (v - 0.5) * 2 * ry;
        const yn = y / ry;

        // الشكل البيضوي المقلوب
        let ring;
        if (yn >= 0) {
          ring = Math.pow(Math.max(0, 1 - yn * yn), 0.40);
        } else {
          ring = Math.pow(Math.max(0, 1 - yn * yn), 0.65);
        }

        for (let i = 0; i <= around; i++) {
          const u = i / around;
          const theta = (u - 0.5) * Math.PI * 2;
          const s = Math.sin(theta);
          const c = Math.cos(theta);

          const x = rx * ring * s;
          let z = rz * ring * c;

          // تفاصيل الوجه
          if (c > 0) {
            const front = Math.pow(c, 5);
            const g = (cx, cy, wx, wy) =>
              Math.exp(
                -Math.pow((x - cx) / wx, 2) -
                Math.pow((y - cy) / wy, 2)
              );

            let relief = 0;
            relief += 0.030 * g(0, 0.55, 0.6, 0.35);
            relief += 0.035 * g(0, 0.10, 0.09, 0.35);
            relief += 0.055 * g(0, -0.18, 0.14, 0.14);
            relief += 0.025 * (g(-0.45, -0.05, 0.22, 0.22) + g(0.45, -0.05, 0.22, 0.22));
            relief += 0.018 * g(0, -0.75, 0.35, 0.20);
            relief -= 0.010 * (g(-0.28, 0.28, 0.17, 0.10) + g(0.28, 0.28, 0.17, 0.10));

            z += front * relief;
          }

          positions.push(x, y, z);
          uvs.push(u, v);

          if (j < vertical && i < around) {
            const a = j * (around + 1) + i;
            const b = a + around + 1;
            indices.push(a, a + 1, b, b, a + 1, b + 1);
          }
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    // ============================================================
    // ✅ نقش واحد نهائي — يُبنى من الصورتين معاً
    // ============================================================
    const TEX_W = 2048;
    const TEX_H = 2048;

    const finalCanvas = document.createElement('canvas');
    finalCanvas.width = TEX_W;
    finalCanvas.height = TEX_H;
    const finalCtx = finalCanvas.getContext('2d');

    // مواد الوجه (نقش واحد)
    const headMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.75,
      metalness: 0,
      transparent: true,
      alphaTest: 0.02,
      side: THREE.FrontSide
    });

    const headTexture = new THREE.CanvasTexture(finalCanvas);
    headTexture.colorSpace = THREE.SRGBColorSpace;
    headTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
    headTexture.needsUpdate = true;
    headMaterial.map = headTexture;

    const head = new THREE.Mesh(makeHeadGeometry(), headMaterial);
    headGroup.add(head);

    // مخزن الصور
    let faceImage = null;
    let sideImage = null;

    // ============================================================
    // ✅ بناء النقش الموحد
    //
    // التخطيط في UV:
    //   u = 0.00 → 0.30 : امتداد الجانب الأيسر (من حافة الصورة الأمامية)
    //   u = 0.30 → 0.70 : صورة الوجه الأمامي كاملة
    //   u = 0.70 → 1.00 : امتداد الجانب الأيمن (من حافة الصورة الأمامية)
    //
    // إذا رُفعت صورة جانبية: تُرسم في u=0..0.30 و u=0.70..1.0
    // وإن لم تُرفع: نمدد ألوان حواف الصورة الأمامية تلقائياً
    // ============================================================
    function buildTexture() {
      finalCtx.clearRect(0, 0, TEX_W, TEX_H);

      // -------- حدود المناطق --------
      const faceX = TEX_W * 0.30;
      const faceW = TEX_W * 0.40;
      const sideLeftX = 0;
      const sideLeftW = TEX_W * 0.30;
      const sideRightX = TEX_W * 0.70;
      const sideRightW = TEX_W * 0.30;

      // ============================================================
      // 1) خلفية عامة (من الصورة الأمامية أو لون افتراضي)
      // ============================================================
      if (!faceImage && !sideImage) {
        finalCtx.fillStyle = '#4a3e38';
        finalCtx.fillRect(0, 0, TEX_W, TEX_H);
        headTexture.needsUpdate = true;
        return;
      }

      // ============================================================
      // 2) استخراج ألوان حواف الصورة الأمامية (للدمج)
      // ============================================================
      let cLeft = { r: 80, g: 70, b: 60 };
      let cRight = { r: 80, g: 70, b: 60 };
      let cTop = { r: 80, g: 70, b: 60 };
      let cBottom = { r: 80, g: 70, b: 60 };

      if (faceImage) {
        const sample = document.createElement('canvas');
        sample.width = 64; sample.height = 64;
        const sx = sample.getContext('2d', { willReadFrequently: true });
        sx.drawImage(faceImage, 0, 0, 64, 64);

        function avg(data) {
          let r = 0, g = 0, b = 0, n = 0;
          for (let i = 0; i < data.length; i += 4) {
            if (data[i + 3] < 20) continue;
            r += data[i]; g += data[i + 1]; b += data[i + 2]; n++;
          }
          if (!n) return { r: 80, g: 70, b: 60 };
          return { r: Math.round(r/n), g: Math.round(g/n), b: Math.round(b/n) };
        }
        cLeft = avg(sx.getImageData(0, 0, 2, 64).data);
        cRight = avg(sx.getImageData(62, 0, 2, 64).data);
        cTop = avg(sx.getImageData(0, 0, 64, 2).data);
        cBottom = avg(sx.getImageData(0, 62, 64, 2).data);
      }

      // ============================================================
      // 3) تعبئة الخلفية العامة (تمنع أي فراغ)
      // ============================================================
      const gradV = finalCtx.createLinearGradient(0, 0, 0, TEX_H);
      gradV.addColorStop(0, `rgb(${cTop.r},${cTop.g},${cTop.b})`);
      gradV.addColorStop(1, `rgb(${cBottom.r},${cBottom.g},${cBottom.b})`);
      finalCtx.fillStyle = gradV;
      finalCtx.fillRect(0, 0, TEX_W, TEX_H);

      // ============================================================
      // 4) رسم صورة الجانب (إن وُجدت) في المنطقتين الجانبيتين
      //    نحافظ على النسبة الطبيعية، تُوسَّط في المنطقة
      // ============================================================
      if (sideImage) {
        // الجانب الأيسر
        drawImageNatural(finalCtx, sideImage, sideLeftX, 0, sideLeftW, TEX_H);

        // الجانب الأيمن (منعكس أفقياً)
        finalCtx.save();
        finalCtx.translate(sideRightX + sideRightW, 0);
        finalCtx.scale(-1, 1);
        drawImageNatural(finalCtx, sideImage, 0, 0, sideRightW, TEX_H);
        finalCtx.restore();
      } else if (faceImage) {
        // لم تُرفع صورة جانبية → نمدد ألوان حواف الصورة الأمامية
        const gradL = finalCtx.createLinearGradient(sideLeftX + sideLeftW, 0, sideLeftX, 0);
        gradL.addColorStop(0, `rgba(${cLeft.r},${cLeft.g},${cLeft.b},1)`);
        gradL.addColorStop(1, `rgba(${cLeft.r},${cLeft.g},${cLeft.b},0.85)`);
        finalCtx.fillStyle = gradL;
        finalCtx.fillRect(sideLeftX, 0, sideLeftW, TEX_H);

        const gradR = finalCtx.createLinearGradient(sideRightX, 0, sideRightX + sideRightW, 0);
        gradR.addColorStop(0, `rgba(${cRight.r},${cRight.g},${cRight.b},1)`);
        gradR.addColorStop(1, `rgba(${cRight.r},${cRight.g},${cRight.b},0.85)`);
        finalCtx.fillStyle = gradR;
        finalCtx.fillRect(sideRightX, 0, sideRightW, TEX_H);
      }

      // ============================================================
      // 5) رسم صورة الوجه الأمامي — بحجمها الطبيعي، كاملة
      // ============================================================
      if (faceImage) {
        drawImageNatural(finalCtx, faceImage, faceX, 0, faceW, TEX_H);

        // ============================================================
        // 6) دمج ناعم عند الحدود اليمنى واليسرى للصورة الأمامية
        //    (يمنع ظهور خط فاصل بين الوجه والجانب)
        // ============================================================
        const blendW = TEX_W * 0.025;

        const gl = finalCtx.createLinearGradient(faceX - blendW, 0, faceX + blendW, 0);
        gl.addColorStop(0, `rgba(${cLeft.r},${cLeft.g},${cLeft.b},0)`);
        gl.addColorStop(0.5, `rgba(${cLeft.r},${cLeft.g},${cLeft.b},0.4)`);
        gl.addColorStop(1, `rgba(${cLeft.r},${cLeft.g},${cLeft.b},0)`);
        finalCtx.fillStyle = gl;
        finalCtx.fillRect(faceX - blendW, 0, blendW * 2, TEX_H);

        const gr = finalCtx.createLinearGradient(faceX + faceW - blendW, 0, faceX + faceW + blendW, 0);
        gr.addColorStop(0, `rgba(${cRight.r},${cRight.g},${cRight.b},0)`);
        gr.addColorStop(0.5, `rgba(${cRight.r},${cRight.g},${cRight.b},0.4)`);
        gr.addColorStop(1, `rgba(${cRight.r},${cRight.g},${cRight.b},0)`);
        finalCtx.fillStyle = gr;
        finalCtx.fillRect(faceX + faceW - blendW, 0, blendW * 2, TEX_H);
      }

      headTexture.needsUpdate = true;
    }

    // ============================================================
    // رسم صورة بحجمها الطبيعي داخل منطقة (مع توسيط)
    // ============================================================
    function drawImageNatural(ctx, image, boxX, boxY, boxW, boxH) {
      const imgAspect = image.width / image.height;
      const boxAspect = boxW / boxH;

      let drawW, drawH, drawX, drawY;
      if (imgAspect >= boxAspect) {
        drawW = Math.min(image.width, boxW);
        drawH = drawW / imgAspect;
        drawX = boxX + (boxW - drawW) / 2;
        drawY = boxY + (boxH - drawH) / 2;
      } else {
        drawH = Math.min(image.height, boxH);
        drawW = drawH * imgAspect;
        drawX = boxX + (boxW - drawW) / 2;
        drawY = boxY + (boxH - drawH) / 2;
      }

      ctx.drawImage(image, 0, 0, image.width, image.height, drawX, drawY, drawW, drawH);
    }

    // ============================================================
    // دوران
    // ============================================================
    let rotY = 0, rotX = 0;
    let targetRotY = 0, targetRotX = 0;

    const MAX_Y = 38, MAX_X = 24;
    const SMOOTH = 0.12;
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    let dragging = false;
    let startX = 0, startY = 0;
    let startRotY = 0, startRotX = 0;

    function resize() {
      const width = Math.max(1, container.clientWidth);
      const height = Math.max(1, container.clientHeight);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.position.z = width < 360 ? 6.2 : 5.6;
      camera.updateProjectionMatrix();
    }

    new ResizeObserver(resize).observe(container);
    window.addEventListener('resize', resize);
    resize();

    function animate() {
      requestAnimationFrame(animate);
      rotY += (targetRotY - rotY) * SMOOTH;
      rotX += (targetRotX - rotX) * SMOOTH;
      headGroup.rotation.set(
        THREE.MathUtils.degToRad(rotX),
        THREE.MathUtils.degToRad(rotY),
        0
      );
      renderer.render(scene, camera);
    }
    animate();

    // ============================================================
    // أزرار
    // ============================================================
    document.getElementById('leftBtn').addEventListener('click', () => {
      targetRotY = clamp(targetRotY - 8, -MAX_Y, MAX_Y);
    });
    document.getElementById('rightBtn').addEventListener('click', () => {
      targetRotY = clamp(targetRotY + 8, -MAX_Y, MAX_Y);
    });
    document.getElementById('upBtn').addEventListener('click', () => {
      targetRotX = clamp(targetRotX + 6, -MAX_X, MAX_X);
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      targetRotY = 0;
      targetRotX = 0;
    });

    // ============================================================
    // السحب
    // ============================================================
    container.addEventListener('pointerdown', (event) => {
      if (event.target !== renderer.domElement) return;
      dragging = true;
      startX = event.clientX;
      startY = event.clientY;
      startRotY = targetRotY;
      startRotX = targetRotX;
      container.setPointerCapture?.(event.pointerId);
      event.preventDefault();
    });

    container.addEventListener('pointermove', (event) => {
      if (!dragging) return;
      targetRotY = clamp(startRotY + (event.clientX - startX) * 0.48, -MAX_Y, MAX_Y);
      targetRotX = clamp(startRotX - (event.clientY - startY) * 0.38, -MAX_X, MAX_X);
    });

    const stopDrag = () => { dragging = false; };
    container.addEventListener('pointerup', stopDrag);
    container.addEventListener('pointercancel', stopDrag);
    container.addEventListener('lostpointercapture', stopDrag);

    // ============================================================
    // رفع الصور
    // ============================================================
    function handleUpload(file, onLoad, onError) {
      if (!file.type.startsWith('image/')) {
        onError('الرجاء اختيار ملف صورة صالح');
        return;
      }
      const img = new Image();
      img.onload = () => {
        onLoad(img);
        URL.revokeObjectURL(img.src);
      };
      img.onerror = () => {
        onError('تعذر تحميل الصورة');
        URL.revokeObjectURL(img.src);
      };
      img.src = URL.createObjectURL(file);
    }

    faceUpload.addEventListener('change', (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      handleUpload(
        file,
        (img) => {
          faceImage = img;
          buildTexture();
          faceStatus.textContent = '✓ جاهزة';
          faceStatus.classList.add('ready');
          status.textContent = 'تم تطبيق صورة الوجه الأمامي.';
        },
        (err) => { status.textContent = err; }
      );
    });

    sideUpload.addEventListener('change', (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      handleUpload(
        file,
        (img) => {
          sideImage = img;
          buildTexture();
          sideStatus.textContent = '✓ جاهزة';
          sideStatus.classList.add('ready');
          status.textContent = 'تم تطبيق صورة الجانب.';
        },
        (err) => { status.textContent = err; }
      );
    });

    window.addEventListener('beforeunload', () => {
      if (headMaterial.map) headMaterial.map.dispose();
      headMaterial.dispose();
      renderer.dispose();
    });
  </script>
</body>
</html>
