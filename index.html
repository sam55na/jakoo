<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1e2b">
  <title>رأس إنسان ثلاثي الأبعاد</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      color: #eaeef5;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: radial-gradient(ellipse at 50% 36%, #343b51 0%, #252b3b 46%, #171b26 100%);
    }
    .scene {
      width: 100%;
      max-width: 700px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
    }
    .face-container {
      position: relative;
      width: min(420px, 88vw);
      height: min(500px, 64vh);
      min-height: 360px;
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      filter: drop-shadow(0 30px 30px rgba(0,0,0,.34));
    }
    .face-container:active { cursor: grabbing; }
    .face-container canvas { display: block; width: 100%; height: 100%; outline: none; }
    .controls {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      padding: 13px 20px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 60px;
      background: rgba(20,24,33,.72);
      box-shadow: 0 15px 35px rgba(0,0,0,.36);
      backdrop-filter: blur(10px);
    }
    .controls button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 40px;
      color: #eaeef5;
      background: rgba(255,255,255,.08);
      box-shadow: 0 4px 10px rgba(0,0,0,.22);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s, transform .2s, border-color .2s;
    }
    .controls button:hover { background: rgba(255,255,255,.18); transform: scale(1.03); border-color: rgba(255,255,255,.3); }
    .controls button:active { transform: scale(.98); }
    .controls button i { font-style: normal; font-size: 1.2rem; }
    .upload-section {
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 40px;
      background: rgba(20,24,33,.72);
      box-shadow: 0 10px 25px rgba(0,0,0,.3);
      backdrop-filter: blur(10px);
    }
    .upload-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 40px;
      color: white;
      background: linear-gradient(135deg,#6a5acd,#8a7bdd);
      box-shadow: 0 4px 15px rgba(106,90,205,.38);
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }
    .upload-label:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(106,90,205,.55); }
    .upload-label input { display: none; }
    .hint {
      max-width: min(540px, 92vw);
      margin-top: 14px;
      padding: 9px 17px;
      border-radius: 30px;
      color: #b0b8c5;
      background: rgba(0,0,0,.26);
      font-size: .84rem;
      line-height: 1.6;
      text-align: center;
    }
    .status { min-height: 1.3em; margin-top: 6px; color: #d4d9e2; font-size: .8rem; text-align: center; }
    @media (max-width: 480px) {
      body { padding: 12px; }
      .face-container { height: min(460px, 59vh); min-height: 330px; }
      .controls { gap: 8px; padding: 10px 12px; }
      .controls button { padding: 9px 13px; font-size: .9rem; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="عارض رأس إنسان ثلاثي الأبعاد">
    <div class="face-container" id="faceContainer" role="img" aria-label="رأس بيضوي ثلاثي الأبعاد قابل للدوران"></div>
  </main>

  <nav class="controls" aria-label="أدوات تدوير الرأس">
    <button id="leftBtn" title="تحريك لليسار"><i>←</i> يسار</button>
    <button id="upBtn" title="إمالة الرأس"><i>↑</i> أعلى</button>
    <button id="rightBtn" title="تحريك لليمين"><i>→</i> يمين</button>
    <button id="resetBtn" title="إعادة تعيين"><i>⟲</i> إعادة</button>
  </nav>

  <section class="upload-section" aria-label="رفع صورة">
    <label class="upload-label" for="imageUpload">
      <span aria-hidden="true">📷</span> اختر صورة وجهك
      <input type="file" id="imageUpload" accept="image/*">
    </label>
  </section>
  <p class="hint">الصورة تُكبَّر لتملأ الوجه بالكامل مع الحفاظ على نسبها، والمناطق الجانبية تأخذ ألوان حوافها من الصورة.</p>
  <p class="status" id="status" aria-live="polite"></p>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';

    const container = document.getElementById('faceContainer');
    const upload = document.getElementById('imageUpload');
    const status = document.getElementById('status');

    // ============================================================
    // المشهد
    // ============================================================
    const scene = new THREE.Scene();
    scene.background = null;

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.02;
    container.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 50);
    camera.position.set(0, 0.05, 5.6);

    scene.add(new THREE.HemisphereLight(0xe5edff, 0x453326, 1.85));

    const keyLight = new THREE.DirectionalLight(0xffe2ca, 2.6);
    keyLight.position.set(-3.5, 4.5, 5.0);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xc6d5ff, 1.15);
    fillLight.position.set(4.0, 1.0, 3.0);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffcda9, 1.5);
    rimLight.position.set(1.5, 3.0, -3.0);
    scene.add(rimLight);

    const headGroup = new THREE.Group();
    scene.add(headGroup);

    // ============================================================
    // القماش (Canvas)
    // ============================================================
    const TEX_W = 2048;
    const TEX_H = 2048;

    const skinCanvas = document.createElement('canvas');
    skinCanvas.width = TEX_W;
    skinCanvas.height = TEX_H;
    const skinCtx = skinCanvas.getContext('2d');

    let currentPhoto = null;
    let headTexture;

    // ============================================================
    // ✅ دالة رسم الصورة بنمط "cover" الحقيقي
    // - تحافظ على نسبة الأبعاد
    // - تكبّر الصورة حتى تغطي الإطار بالكامل
    // - تقص الأجزاء الزائدة (لا تمدد!)
    // ============================================================
    function drawImageCover(ctx, image, destX, destY, destW, destH) {
      const imgW = image.width;
      const imgH = image.height;
      const imgAspect = imgW / imgH;
      const destAspect = destW / destH;

      let srcX, srcY, srcW, srcH;

      if (imgAspect > destAspect) {
        // الصورة أعرض من الهدف: نقص الجانبين
        srcH = imgH;
        srcW = imgH * destAspect;
        srcX = (imgW - srcW) / 2;
        srcY = 0;
      } else {
        // الصورة أطول من الهدف: نقص الأعلى والأسفل
        srcW = imgW;
        srcH = imgW / destAspect;
        srcX = 0;
        srcY = (imgH - srcH) / 2;
      }

      // ✅ رسم الصورة بشكل صحيح (تكبير متناسق + قص)
      ctx.drawImage(
        image,
        srcX, srcY, srcW, srcH,       // المنطقة المقتطعة من المصدر
        destX, destY, destW, destH    // الحجم النهائي (بدون تشويه)
      );
    }

    // ============================================================
    // استخراج ألوان الحواف من الصورة
    // ============================================================
    function extractEdgeColors(image) {
      const sampleW = 256;
      const sampleH = 256;
      const sample = document.createElement('canvas');
      sample.width = sampleW;
      sample.height = sampleH;
      const ctx = sample.getContext('2d', { willReadFrequently: true });

      ctx.drawImage(image, 0, 0, sampleW, sampleH);

      const leftData = ctx.getImageData(0, 0, 1, sampleH).data;
      const rightData = ctx.getImageData(sampleW - 1, 0, 1, sampleH).data;

      const leftColors = [];
      const rightColors = [];
      for (let i = 0; i < sampleH; i++) {
        const li = i * 4;
        leftColors.push({
          r: leftData[li],
          g: leftData[li + 1],
          b: leftData[li + 2]
        });
        rightColors.push({
          r: rightData[li],
          g: rightData[li + 1],
          b: rightData[li + 2]
        });
      }
      return { leftColors, rightColors, sampleH };
    }

    // ============================================================
    // ✅ رسم القماش
    //
    // المنطق:
    // 1. الصورة تُكبَّر بنمط cover لتملأ الوجه بالكامل
    // 2. المنطقتان الجانبيتان في UV تأخذان ألوانها من حواف الصورة
    // 3. لا حواف فارغة، لا تمدد
    // ============================================================
    function paintHeadTexture() {
      skinCtx.clearRect(0, 0, TEX_W, TEX_H);

      if (!currentPhoto) {
        skinCtx.fillStyle = '#d9bfa8';
        skinCtx.fillRect(0, 0, TEX_W, TEX_H);
        if (headTexture) headTexture.needsUpdate = true;
        return;
      }

      // ============================================================
      // 1) حساب ألوان الحواف أولاً
      // ============================================================
      const { leftColors, rightColors, sampleH } = extractEdgeColors(currentPhoto);

      // متوسط اللون من الحواف
      let avgR = 0, avgG = 0, avgB = 0, count = 0;
      for (let i = 0; i < sampleH; i++) {
        avgR += leftColors[i].r + rightColors[i].r;
        avgG += leftColors[i].g + rightColors[i].g;
        avgB += leftColors[i].b + rightColors[i].b;
        count += 2;
      }
      avgR = Math.round(avgR / count);
      avgG = Math.round(avgG / count);
      avgB = Math.round(avgB / count);

      // ملء كامل القماش بالمتوسط (خلفية احتياطية)
      skinCtx.fillStyle = `rgb(${avgR},${avgG},${avgB})`;
      skinCtx.fillRect(0, 0, TEX_W, TEX_H);

      // ============================================================
      // 2) ✅ رسم الصورة بنمط cover في منطقة الوجه الأمامية
      //
      // منطقة الوجه في UV: من u=0.25 إلى u=0.75
      // أي: عرض = نصف القماش، يغطي الجهة الأمامية بالكامل
      // ============================================================
      const faceU0 = 0.25;
      const faceU1 = 0.75;
      const faceX = TEX_W * faceU0;
      const faceW = TEX_W * (faceU1 - faceU0);
      const faceY = 0;
      const faceH = TEX_H;

      drawImageCover(skinCtx, currentPhoto, faceX, faceY, faceW, faceH);

      // ============================================================
      // 3) ✅ تمديد الجوانب بألوان من حواف الصورة نفسها
      // كل صف أفقي في الشريط الجانبي يأخذ لونه من نفس الصف في حافة الصورة
      // ============================================================
      const leftBandW = Math.ceil(TEX_W * faceU0);      // عرض الشريط الأيسر
      const rightBandW = Math.ceil(TEX_W * (1 - faceU1)); // عرض الشريط الأيمن

      // نرسم الصورة على canvas مؤقت لأخذ البكسلات الحقيقية
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = currentPhoto.width;
      tempCanvas.height = currentPhoto.height;
      const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
      tempCtx.drawImage(currentPhoto, 0, 0);

      // ملاحظة: يجب أن يكون القص متطابقاً مع drawImageCover
      // نحسب نفس المنطقة المقتطعة
      const imgW = currentPhoto.width;
      const imgH = currentPhoto.height;
      const imgAspect = imgW / imgH;
      const destAspect = faceW / faceH;

      let srcX, srcY, srcW, srcH;
      if (imgAspect > destAspect) {
        srcH = imgH;
        srcW = imgH * destAspect;
        srcX = (imgW - srcW) / 2;
        srcY = 0;
      } else {
        srcW = imgW;
        srcH = imgW / destAspect;
        srcX = 0;
        srcY = (imgH - srcH) / 2;
      }

      // أعمدة الحواف الحقيقية (بعد القص)
      let leftEdgeData = null;
      let rightEdgeData = null;
      try {
        leftEdgeData = tempCtx.getImageData(
          Math.floor(srcX), Math.floor(srcY), 1, Math.floor(srcH)
        ).data;
        rightEdgeData = tempCtx.getImageData(
          Math.floor(srcX + srcW) - 1, Math.floor(srcY), 1, Math.floor(srcH)
        ).data;
      } catch (e) {
        console.warn('تعذر قراءة حواف الصورة:', e);
      }

      // ============================================================
      // رسم الشريط الأيسر
      // ============================================================
      if (leftEdgeData) {
        const leftBand = document.createElement('canvas');
        leftBand.width = leftBandW;
        leftBand.height = TEX_H;
        const lbCtx = leftBand.getContext('2d');
        const bandImg = lbCtx.createImageData(leftBandW, TEX_H);

        for (let y = 0; y < TEX_H; y++) {
          // نأخذ اللون من نفس النسبة في حافة الصورة
          const srcYi = Math.floor((y / TEX_H) * (srcH - 1));
          const si = srcYi * 4;
          const r = leftEdgeData[si];
          const g = leftEdgeData[si + 1];
          const b = leftEdgeData[si + 2];

          for (let x = 0; x < leftBandW; x++) {
            // تلاشي تدريجي كلما ابتعدنا (ناحية u=0)
            // x=0 هو الأبعد، x=leftBandW-1 هو الملاصق للصورة
            const distFromImage = (leftBandW - 1 - x) / leftBandW;
            const fade = 1 - distFromImage * 0.25;
            const di = (y * leftBandW + x) * 4;
            bandImg.data[di]     = Math.round(r * fade + avgR * (1 - fade));
            bandImg.data[di + 1] = Math.round(g * fade + avgG * (1 - fade));
            bandImg.data[di + 2] = Math.round(b * fade + avgB * (1 - fade));
            bandImg.data[di + 3] = 255;
          }
        }
        lbCtx.putImageData(bandImg, 0, 0);
        skinCtx.drawImage(leftBand, 0, 0, leftBandW, TEX_H, 0, 0, leftBandW, TEX_H);
      }

      // ============================================================
      // رسم الشريط الأيمن
      // ============================================================
      if (rightEdgeData) {
        const rightBand = document.createElement('canvas');
        rightBand.width = rightBandW;
        rightBand.height = TEX_H;
        const rbCtx = rightBand.getContext('2d');
        const bandImg = rbCtx.createImageData(rightBandW, TEX_H);

        for (let y = 0; y < TEX_H; y++) {
          const srcYi = Math.floor((y / TEX_H) * (srcH - 1));
          const si = srcYi * 4;
          const r = rightEdgeData[si];
          const g = rightEdgeData[si + 1];
          const b = rightEdgeData[si + 2];

          for (let x = 0; x < rightBandW; x++) {
            // x=0 ملاصق للصورة، x=rightBandW-1 هو الأبعد
            const distFromImage = x / rightBandW;
            const fade = 1 - distFromImage * 0.25;
            const di = (y * rightBandW + x) * 4;
            bandImg.data[di]     = Math.round(r * fade + avgR * (1 - fade));
            bandImg.data[di + 1] = Math.round(g * fade + avgG * (1 - fade));
            bandImg.data[di + 2] = Math.round(b * fade + avgB * (1 - fade));
            bandImg.data[di + 3] = 255;
          }
        }
        rbCtx.putImageData(bandImg, 0, 0);
        skinCtx.drawImage(rightBand, 0, 0, rightBandW, TEX_H, TEX_W - rightBandW, 0, rightBandW, TEX_H);
      }

      if (headTexture) headTexture.needsUpdate = true;
    }

    headTexture = new THREE.CanvasTexture(skinCanvas);
    headTexture.colorSpace = THREE.SRGBColorSpace;
    headTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
    headTexture.wrapS = THREE.RepeatWrapping;
    headTexture.wrapT = THREE.ClampToEdgeWrapping;
    paintHeadTexture();

    // ============================================================
    // ✅ الشكل البيضوي المقلوب
    // ============================================================
    function makeHeadGeometry() {
      const around = 192;
      const vertical = 200;

      const positions = [];
      const uvs = [];
      const indices = [];

      const rx = 1.0;
      const rz = 0.78;
      const halfHeight = 1.35;

      for (let j = 0; j <= vertical; j++) {
        const v = j / vertical;
        const y = (v - 0.5) * 2 * halfHeight;
        const yn = y / halfHeight;

        let ring;
        if (yn >= 0) {
          // النصف العلوي: عريض (الجمجمة)
          ring = Math.pow(Math.max(0, 1 - yn * yn), 0.42);
        } else {
          // النصف السفلي: مدبب (الفك)
          ring = Math.pow(Math.max(0, 1 - yn * yn), 0.62);
        }

        for (let i = 0; i <= around; i++) {
          const u = i / around;
          const theta = (u - 0.5) * Math.PI * 2;
          const s = Math.sin(theta);
          const c = Math.cos(theta);

          const x = rx * ring * s;
          let z = rz * ring * c;

          if (c > 0) {
            const front = Math.pow(c, 5);
            const g = (cx, cy, wx, wy) =>
              Math.exp(
                -Math.pow((x - cx) / wx, 2) -
                Math.pow((y - cy) / wy, 2)
              );

            let relief = 0;
            relief += 0.028 * g(0, 0.55, 0.6, 0.35);
            relief += 0.032 * g(0, 0.10, 0.09, 0.35);
            relief += 0.052 * g(0, -0.18, 0.14, 0.14);
            relief += 0.025 * (g(-0.45, -0.05, 0.22, 0.22) + g(0.45, -0.05, 0.22, 0.22));
            relief += 0.018 * g(0, -0.75, 0.35, 0.20);
            relief -= 0.010 * (g(-0.28, 0.28, 0.17, 0.10) + g(0.28, 0.28, 0.17, 0.10));

            z += front * relief;
          }

          positions.push(x, y, z);
          uvs.push(u, v);

          if (j < vertical && i < around) {
            const a = j * (around + 1) + i;
            const b = a + around + 1;
            indices.push(a, a + 1, b, b, a + 1, b + 1);
          }
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    const skinMaterial = new THREE.MeshStandardMaterial({
      map: headTexture,
      color: 0xffffff,
      roughness: 0.82,
      metalness: 0,
      side: THREE.FrontSide
    });

    const head = new THREE.Mesh(makeHeadGeometry(), skinMaterial);
    headGroup.add(head);

    // ============================================================
    // دوران
    // ============================================================
    let rotY = 0, rotX = 0;
    let targetRotY = 0, targetRotX = 0;

    const MAX_Y = 38, MAX_X = 24;
    const SMOOTH = 0.12;
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    let dragging = false;
    let startX = 0, startY = 0;
    let startRotY = 0, startRotX = 0;

    function resize() {
      const width = Math.max(1, container.clientWidth);
      const height = Math.max(1, container.clientHeight);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.position.z = width < 360 ? 6.2 : 5.6;
      camera.updateProjectionMatrix();
    }

    new ResizeObserver(resize).observe(container);
    window.addEventListener('resize', resize);
    resize();

    function animate() {
      requestAnimationFrame(animate);
      rotY += (targetRotY - rotY) * SMOOTH;
      rotX += (targetRotX - rotX) * SMOOTH;
      headGroup.rotation.set(
        THREE.MathUtils.degToRad(rotX),
        THREE.MathUtils.degToRad(rotY),
        0
      );
      renderer.render(scene, camera);
    }
    animate();

    // ============================================================
    // أزرار التحكم
    // ============================================================
    document.getElementById('leftBtn').addEventListener('click', () => {
      targetRotY = clamp(targetRotY - 8, -MAX_Y, MAX_Y);
    });
    document.getElementById('rightBtn').addEventListener('click', () => {
      targetRotY = clamp(targetRotY + 8, -MAX_Y, MAX_Y);
    });
    document.getElementById('upBtn').addEventListener('click', () => {
      targetRotX = clamp(targetRotX + 6, -MAX_X, MAX_X);
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      targetRotY = 0;
      targetRotX = 0;
    });

    // ============================================================
    // السحب
    // ============================================================
    container.addEventListener('pointerdown', (event) => {
      if (event.target !== renderer.domElement) return;
      dragging = true;
      startX = event.clientX;
      startY = event.clientY;
      startRotY = targetRotY;
      startRotX = targetRotX;
      container.setPointerCapture?.(event.pointerId);
      event.preventDefault();
    });

    container.addEventListener('pointermove', (event) => {
      if (!dragging) return;
      targetRotY = clamp(startRotY + (event.clientX - startX) * 0.48, -MAX_Y, MAX_Y);
      targetRotX = clamp(startRotX - (event.clientY - startY) * 0.38, -MAX_X, MAX_X);
    });

    const stopDrag = () => { dragging = false; };
    container.addEventListener('pointerup', stopDrag);
    container.addEventListener('pointercancel', stopDrag);
    container.addEventListener('lostpointercapture', stopDrag);

    // ============================================================
    // رفع الصورة
    // ============================================================
    let userUploadedPhoto = false;

    upload.addEventListener('change', (event) => {
      const file = event.target.files?.[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        alert('الرجاء اختيار ملف صورة صالح');
        upload.value = '';
        return;
      }

      const image = new Image();
      image.onload = () => {
        userUploadedPhoto = true;
        currentPhoto = image;
        paintHeadTexture();
        status.textContent = 'تم تطبيق الصورة بتكبير متناسق على كامل الوجه.';
        URL.revokeObjectURL(image.src);
      };
      image.onerror = () => {
        status.textContent = 'تعذر تحميل الصورة. جرّب ملف صورة آخر.';
        URL.revokeObjectURL(image.src);
      };
      image.src = URL.createObjectURL(file);
    });

    // صورة افتراضية
    const sample = new Image();
    sample.crossOrigin = 'anonymous';
    sample.onload = () => {
      if (!userUploadedPhoto) {
        currentPhoto = sample;
        paintHeadTexture();
      }
    };
    sample.onerror = () => {};
    sample.src = 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=600&auto=format&fit=crop&q=80&ixlib=rb-4.0.3';

    window.addEventListener('beforeunload', () => {
      headTexture.dispose();
      skinMaterial.dispose();
      renderer.dispose();
    });
  </script>
</body>
</html>
