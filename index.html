<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1e2b">
  <title>رأس إنسان ثلاثي الأبعاد</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      color: #eaeef5;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: radial-gradient(ellipse at 50% 36%, #343b51 0%, #252b3b 46%, #171b26 100%);
    }
    .scene {
      width: 100%;
      max-width: 700px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
    }
    .face-container {
      position: relative;
      width: min(420px, 88vw);
      height: min(500px, 64vh);
      min-height: 360px;
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      filter: drop-shadow(0 30px 30px rgba(0,0,0,.34));
    }
    .face-container:active { cursor: grabbing; }
    .face-container canvas { display: block; width: 100%; height: 100%; outline: none; }
    .controls {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      padding: 13px 20px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 60px;
      background: rgba(20,24,33,.72);
      box-shadow: 0 15px 35px rgba(0,0,0,.36);
      backdrop-filter: blur(10px);
    }
    .controls button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 40px;
      color: #eaeef5;
      background: rgba(255,255,255,.08);
      box-shadow: 0 4px 10px rgba(0,0,0,.22);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s, transform .2s, border-color .2s;
    }
    .controls button:hover { background: rgba(255,255,255,.18); transform: scale(1.03); border-color: rgba(255,255,255,.3); }
    .controls button:active { transform: scale(.98); }
    .controls button i { font-style: normal; font-size: 1.2rem; }
    .upload-section {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 40px;
      background: rgba(20,24,33,.72);
      box-shadow: 0 10px 25px rgba(0,0,0,.3);
      backdrop-filter: blur(10px);
    }
    .upload-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 40px;
      color: white;
      background: linear-gradient(135deg,#6a5acd,#8a7bdd);
      box-shadow: 0 4px 15px rgba(106,90,205,.38);
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }
    .upload-label.side {
      background: linear-gradient(135deg,#4a7a6a,#6aa08d);
      box-shadow: 0 4px 15px rgba(74,122,106,.38);
    }
    .upload-label:hover { transform: translateY(-2px); }
    .upload-label input { display: none; }
    .upload-status {
      font-size: .75rem;
      color: #9ba3b0;
      min-width: 60px;
      text-align: center;
    }
    .upload-status.ready { color: #7ed4a8; }
    .hint {
      max-width: min(580px, 92vw);
      margin-top: 14px;
      padding: 9px 17px;
      border-radius: 30px;
      color: #b0b8c5;
      background: rgba(0,0,0,.26);
      font-size: .82rem;
      line-height: 1.6;
      text-align: center;
    }
    .status { min-height: 1.3em; margin-top: 6px; color: #d4d9e2; font-size: .8rem; text-align: center; }
    @media (max-width: 480px) {
      body { padding: 12px; }
      .face-container { height: min(460px, 59vh); min-height: 330px; }
      .controls { gap: 8px; padding: 10px 12px; }
      .controls button { padding: 9px 13px; font-size: .9rem; }
      .upload-label { padding: 9px 15px; font-size: .82rem; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="عارض رأس إنسان ثلاثي الأبعاد">
    <div class="face-container" id="faceContainer" role="img" aria-label="رأس ثلاثي الأبعاد قابل للدوران"></div>
  </main>

  <nav class="controls" aria-label="أدوات تدوير الرأس">
    <button id="leftBtn" title="تحريك لليسار"><i>←</i> يسار</button>
    <button id="upBtn" title="إمالة الرأس"><i>↑</i> أعلى</button>
    <button id="rightBtn" title="تحريك لليمين"><i>→</i> يمين</button>
    <button id="resetBtn" title="إعادة تعيين"><i>⟲</i> إعادة</button>
  </nav>

  <section class="upload-section" aria-label="رفع الصور">
    <label class="upload-label" for="faceUpload">
      <span aria-hidden="true">🙂</span> صورة الوجه (PNG شفاف)
      <input type="file" id="faceUpload" accept="image/*">
    </label>
    <span class="upload-status" id="faceStatus">لم تُرفع</span>

    <label class="upload-label side" for="sideUpload">
      <span aria-hidden="true">💇</span> صورة الجوانب (اختياري)
      <input type="file" id="sideUpload" accept="image/*">
    </label>
    <span class="upload-status" id="sideStatus">اختياري</span>
  </section>

  <p class="hint">
    💡 ارفع صورة PNG بخلفية شفافة. الصورة تُقصّ تلقائياً على شكل الرأس وتُعرض كاملة بدون أي تغيير.
  </p>
  <p class="status" id="status" aria-live="polite"></p>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';

    const container = document.getElementById('faceContainer');
    const faceUpload = document.getElementById('faceUpload');
    const sideUpload = document.getElementById('sideUpload');
    const faceStatus = document.getElementById('faceStatus');
    const sideStatus = document.getElementById('sideStatus');
    const status = document.getElementById('status');

    // ============================================================
    // المشهد
    // ============================================================
    const scene = new THREE.Scene();
    scene.background = null;

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 50);
    camera.position.set(0, 0.05, 5.6);

    scene.add(new THREE.HemisphereLight(0xe5edff, 0x453326, 2.0));

    const keyLight = new THREE.DirectionalLight(0xffe2ca, 2.6);
    keyLight.position.set(-3.5, 4.5, 5.0);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xc6d5ff, 1.2);
    fillLight.position.set(4.0, 1.0, 3.0);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffcda9, 1.6);
    rimLight.position.set(1.5, 3.0, -3.0);
    scene.add(rimLight);

    const headGroup = new THREE.Group();
    scene.add(headGroup);

    // ============================================================
    // أبعاد الرأس
    // ============================================================
    const HEAD_W = 1.55;
    const HEAD_H = 2.0;
    const HEAD_D = 1.15;

    // ============================================================
    // ✅ بناء الرأس — نفس المجسم يُستخدم للنقش والجمجمة
    // ============================================================
    function makeHeadGeometry(offsetZ = 0, scale = 1) {
      const around = 128;
      const vertical = 160;

      const positions = [];
      const uvs = [];
      const indices = [];

      const rx = (HEAD_W / 2) * scale;
      const rz = (HEAD_D / 2) * scale;
      const ry = (HEAD_H / 2) * scale;

      for (let j = 0; j <= vertical; j++) {
        const v = j / vertical;
        const y = (v - 0.5) * 2 * ry;
        const yn = y / ry;

        // ✅ الشكل البيضوي المقلوب
        let ring;
        if (yn >= 0) {
          ring = Math.pow(Math.max(0, 1 - yn * yn), 0.40);
        } else {
          ring = Math.pow(Math.max(0, 1 - yn * yn), 0.65);
        }

        for (let i = 0; i <= around; i++) {
          const u = i / around;
          const theta = (u - 0.5) * Math.PI * 2;
          const s = Math.sin(theta);
          const c = Math.cos(theta);

          const x = rx * ring * s;
          let z = rz * ring * c + offsetZ;

          // ✅ نتوءات الوجه (أنف، جبهة، فك) للواقعية
          if (c > 0) {
            const front = Math.pow(c, 5);
            const g = (cx, cy, wx, wy) =>
              Math.exp(
                -Math.pow((x - cx) / wx, 2) -
                Math.pow((y - cy) / wy, 2)
              );

            let relief = 0;
            relief += 0.030 * g(0, 0.55, 0.6, 0.35);    // جبهة
            relief += 0.035 * g(0, 0.10, 0.09, 0.35);   // جسر الأنف
            relief += 0.055 * g(0, -0.18, 0.14, 0.14);  // رأس الأنف
            relief += 0.025 * (g(-0.45, -0.05, 0.22, 0.22) + g(0.45, -0.05, 0.22, 0.22)); // وجنتين
            relief += 0.018 * g(0, -0.75, 0.35, 0.20);  // فك
            relief -= 0.010 * (g(-0.28, 0.28, 0.17, 0.10) + g(0.28, 0.28, 0.17, 0.10)); // تجويف عين

            z += front * relief;
          }

          positions.push(x, y, z);
          uvs.push(u, v);

          if (j < vertical && i < around) {
            const a = j * (around + 1) + i;
            const b = a + around + 1;
            indices.push(a, a + 1, b, b, a + 1, b + 1);
          }
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    // ============================================================
    // ✅ طبقة 1: الجمجمة الأساسية (احتياطية، تُخفى عندما ترفع صورة)
    // ============================================================
    const skullMaterial = new THREE.MeshStandardMaterial({
      color: 0x6b5a4e,
      roughness: 0.9,
      metalness: 0
    });

    const skull = new THREE.Mesh(makeHeadGeometry(), skullMaterial);
    headGroup.add(skull);

    // ============================================================
    // ✅ طبقة 2: الوجه المنقوش بالصورة
    //    نفس شكل المجسم بالضبط + توسيع بسيط جداً (0.5%)
    //    حتى يغطي الجمجمة تماماً بدون أي حواف
    // ============================================================
    const faceMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.72,
      metalness: 0,
      transparent: true,
      alphaTest: 0.02,     // يخفي البكسلات الشفافة تماماً
      side: THREE.FrontSide
    });

    // ✅ نفس المجسم لكن بمقياس أكبر بـ 0.5% ليغطي الجمجمة
    const faceGeometry = makeHeadGeometry(0, 1.005);
    const faceMesh = new THREE.Mesh(faceGeometry, faceMaterial);
    headGroup.add(faceMesh);

    // ============================================================
    // ✅ طبقة 3: الجوانب (اختيارية) — نفس المجسم بمقياس 1.01
    //    تُستخدم فقط إذا رفع المستخدم صورة جوانب
    // ============================================================
    const sideMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.85,
      metalness: 0,
      transparent: true,
      alphaTest: 0.02,
      side: THREE.FrontSide
    });

    const sideGeometry = makeHeadGeometry(0, 1.01);
    const sideMesh = new THREE.Mesh(sideGeometry, sideMaterial);
    sideMesh.visible = false;
    headGroup.add(sideMesh);

    // ============================================================
    // ✅ تحضير نقش الصورة
    //
    // المنطق:
    // 1. نرسم الصورة على canvas بحدود UV (u من 0 إلى 1)
    // 2. نضيف خلفية بلون من حواف الصورة (لتغطية أطراف UV)
    // 3. الصورة تظهر كاملة في منتصف الوجه (u=0.25..0.75)
    // 4. الجوانب تأخذ ألوانها من حواف الصورة
    // ============================================================
    const TEX_W = 2048;
    const TEX_H = 2048;

    function prepareFaceTexture(image, canvas, ctx) {
      ctx.clearRect(0, 0, TEX_W, TEX_H);

      // نرسم الصورة في المنطقة الأمامية (u = 0.25 → 0.75)
      const faceX = TEX_W * 0.25;
      const faceW = TEX_W * 0.50;

      // ✅ الصورة تُرسم كاملة، بدون تكبير أو قص
      //    نحافظ على نسبتها الطبيعية ونوسّطها في المنطقة
      const imgAspect = image.width / image.height;
      const boxAspect = faceW / TEX_H;

      let drawW, drawH, drawX, drawY;
      if (imgAspect >= boxAspect) {
        // الصورة أعرض من الصندوق
        drawW = faceW;
        drawH = faceW / imgAspect;
        drawX = faceX;
        drawY = (TEX_H - drawH) / 2;
      } else {
        // الصورة أطول من الصندوق
        drawH = TEX_H;
        drawW = TEX_H * imgAspect;
        drawX = faceX + (faceW - drawW) / 2;
        drawY = 0;
      }

      // استخراج ألوان من حواف الصورة
      const sampleCanvas = document.createElement('canvas');
      sampleCanvas.width = 64;
      sampleCanvas.height = 64;
      const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });
      sampleCtx.drawImage(image, 0, 0, 64, 64);

      // متوسط اللون من كل الأطراف
      const topData = sampleCtx.getImageData(0, 0, 64, 2).data;
      const bottomData = sampleCtx.getImageData(0, 62, 64, 2).data;
      const leftData = sampleCtx.getImageData(0, 0, 2, 64).data;
      const rightData = sampleCtx.getImageData(62, 0, 2, 64).data;

      function avg(data) {
        let r = 0, g = 0, b = 0, n = 0;
        for (let i = 0; i < data.length; i += 4) {
          if (data[i + 3] < 20) continue;
          r += data[i]; g += data[i + 1]; b += data[i + 2]; n++;
        }
        if (!n) return { r: 120, g: 110, b: 100 };
        return { r: Math.round(r/n), g: Math.round(g/n), b: Math.round(b/n) };
      }

      const cTop = avg(topData);
      const cBottom = avg(bottomData);
      const cLeft = avg(leftData);
      const cRight = avg(rightData);

      // ✅ تعبئة الخلفية بتدرج من 4 ألوان مستخرجة
      // (تعبئة كامل القماش أولاً لضمان عدم وجود فراغات)
      const gradV = ctx.createLinearGradient(0, 0, 0, TEX_H);
      gradV.addColorStop(0, `rgb(${cTop.r},${cTop.g},${cTop.b})`);
      gradV.addColorStop(1, `rgb(${cBottom.r},${cBottom.g},${cBottom.b})`);
      ctx.fillStyle = gradV;
      ctx.fillRect(0, 0, TEX_W, TEX_H);

      const gradH = ctx.createLinearGradient(0, 0, TEX_W, 0);
      gradH.addColorStop(0, `rgba(${cLeft.r},${cLeft.g},${cLeft.b},0.6)`);
      gradH.addColorStop(0.25, `rgba(${cLeft.r},${cLeft.g},${cLeft.b},0)`);
      gradH.addColorStop(0.75, `rgba(${cRight.r},${cRight.g},${cRight.b},0)`);
      gradH.addColorStop(1, `rgba(${cRight.r},${cRight.g},${cRight.b},0.6)`);
      ctx.fillStyle = gradH;
      ctx.fillRect(0, 0, TEX_W, TEX_H);

      // ✅ رسم الصورة كاملة بنسبتها الطبيعية
      ctx.drawImage(
        image,
        0, 0, image.width, image.height,
        drawX, drawY, drawW, drawH
      );

      // ✅ دمج ناعم عند الحدود (يمنع الحواف المستقيمة الظاهرة)
      // تدرج تلاشي على الحدود اليمنى واليسرى للصورة
      const blendW = TEX_W * 0.03;

      const gl = ctx.createLinearGradient(faceX - blendW, 0, faceX, 0);
      gl.addColorStop(0, `rgba(${cLeft.r},${cLeft.g},${cLeft.b},1)`);
      gl.addColorStop(1, `rgba(${cLeft.r},${cLeft.g},${cLeft.b},0)`);
      ctx.fillStyle = gl;
      ctx.fillRect(faceX - blendW, 0, blendW, TEX_H);

      const gr = ctx.createLinearGradient(faceX + faceW, 0, faceX + faceW + blendW, 0);
      gr.addColorStop(0, `rgba(${cRight.r},${cRight.g},${cRight.b},0)`);
      gr.addColorStop(1, `rgba(${cRight.r},${cRight.g},${cRight.b},1)`);
      ctx.fillStyle = gr;
      ctx.fillRect(faceX + faceW, 0, blendW, TEX_H);
    }

    // ============================================================
    // رفع الصور
    // ============================================================
    function handleUpload(file, onLoad, onError) {
      if (!file.type.startsWith('image/')) {
        onError('الرجاء اختيار ملف صورة صالح');
        return;
      }
      const image = new Image();
      image.onload = () => {
        onLoad(image);
        URL.revokeObjectURL(image.src);
      };
      image.onerror = () => {
        onError('تعذر تحميل الصورة');
        URL.revokeObjectURL(image.src);
      };
      image.src = URL.createObjectURL(file);
    }

    faceUpload.addEventListener('change', (event) => {
      const file = event.target.files?.[0];
      if (!file) return;

      handleUpload(
        file,
        (image) => {
          const canvas = document.createElement('canvas');
          canvas.width = TEX_W;
          canvas.height = TEX_H;
          const ctx = canvas.getContext('2d');
          prepareFaceTexture(image, canvas, ctx);

          const texture = new THREE.CanvasTexture(canvas);
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
          texture.needsUpdate = true;

          if (faceMaterial.map) faceMaterial.map.dispose();
          faceMaterial.map = texture;
          faceMaterial.needsUpdate = true;

          // إخفاء الجمجمة عندما تُرفع صورة
          skull.visible = false;

          faceStatus.textContent = '✓ جاهزة';
          faceStatus.classList.add('ready');
          status.textContent = 'تم تطبيق صورة الوجه كاملة. اسحب لرؤية الجوانب.';
        },
        (err) => { status.textContent = err; }
      );
    });

    sideUpload.addEventListener('change', (event) => {
      const file = event.target.files?.[0];
      if (!file) return;

      handleUpload(
        file,
        (image) => {
          const canvas = document.createElement('canvas');
          canvas.width = TEX_W;
          canvas.height = TEX_H;
          const ctx = canvas.getContext('2d');
          prepareFaceTexture(image, canvas, ctx);

          const texture = new THREE.CanvasTexture(canvas);
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
          texture.needsUpdate = true;

          if (sideMaterial.map) sideMaterial.map.dispose();
          sideMaterial.map = texture;
          sideMaterial.needsUpdate = true;

          sideMesh.visible = true;

          sideStatus.textContent = '✓ جاهزة';
          sideStatus.classList.add('ready');
          status.textContent = 'تم تطبيق صورة الجوانب.';
        },
        (err) => { status.textContent = err; }
      );
    });

    // ============================================================
    // دوران
    // ============================================================
    let rotY = 0, rotX = 0;
    let targetRotY = 0, targetRotX = 0;

    const MAX_Y = 38, MAX_X = 24;
    const SMOOTH = 0.12;
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    let dragging = false;
    let startX = 0, startY = 0;
    let startRotY = 0, startRotX = 0;

    function resize() {
      const width = Math.max(1, container.clientWidth);
      const height = Math.max(1, container.clientHeight);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.position.z = width < 360 ? 6.2 : 5.6;
      camera.updateProjectionMatrix();
    }

    new ResizeObserver(resize).observe(container);
    window.addEventListener('resize', resize);
    resize();

    function animate() {
      requestAnimationFrame(animate);
      rotY += (targetRotY - rotY) * SMOOTH;
      rotX += (targetRotX - rotX) * SMOOTH;
      headGroup.rotation.set(
        THREE.MathUtils.degToRad(rotX),
        THREE.MathUtils.degToRad(rotY),
        0
      );
      renderer.render(scene, camera);
    }
    animate();

    // أزرار
    document.getElementById('leftBtn').addEventListener('click', () => {
      targetRotY = clamp(targetRotY - 8, -MAX_Y, MAX_Y);
    });
    document.getElementById('rightBtn').addEventListener('click', () => {
      targetRotY = clamp(targetRotY + 8, -MAX_Y, MAX_Y);
    });
    document.getElementById('upBtn').addEventListener('click', () => {
      targetRotX = clamp(targetRotX + 6, -MAX_X, MAX_X);
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      targetRotY = 0;
      targetRotX = 0;
    });

    // السحب
    container.addEventListener('pointerdown', (event) => {
      if (event.target !== renderer.domElement) return;
      dragging = true;
      startX = event.clientX;
      startY = event.clientY;
      startRotY = targetRotY;
      startRotX = targetRotX;
      container.setPointerCapture?.(event.pointerId);
      event.preventDefault();
    });

    container.addEventListener('pointermove', (event) => {
      if (!dragging) return;
      targetRotY = clamp(startRotY + (event.clientX - startX) * 0.48, -MAX_Y, MAX_Y);
      targetRotX = clamp(startRotX - (event.clientY - startY) * 0.38, -MAX_X, MAX_X);
    });

    const stopDrag = () => { dragging = false; };
    container.addEventListener('pointerup', stopDrag);
    container.addEventListener('pointercancel', stopDrag);
    container.addEventListener('lostpointercapture', stopDrag);

    window.addEventListener('beforeunload', () => {
      if (faceMaterial.map) faceMaterial.map.dispose();
      if (sideMaterial.map) sideMaterial.map.dispose();
      faceMaterial.dispose();
      sideMaterial.dispose();
      skullMaterial.dispose();
      renderer.dispose();
    });
  </script>
</body>
</html>
