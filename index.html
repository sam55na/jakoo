<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رأس 3D — صورة على الوجه فقط</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #eaeef5;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: radial-gradient(ellipse at 50% 36%, #343b51 0%, #252b3b 46%, #171b26 100%);
    }
    .scene {
      width: min(500px, 90vw);
      height: min(600px, 70vh);
      cursor: grab;
      touch-action: none;
      position: relative;
      filter: drop-shadow(0 30px 40px rgba(0,0,0,.5));
    }
    .scene:active { cursor: grabbing; }
    .scene canvas { display: block; width: 100% !important; height: 100% !important; }
    .controls {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      padding: 13px 20px;
      border-radius: 60px;
      background: rgba(20,24,33,.72);
      border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(10px);
    }
    .controls button {
      padding: 10px 20px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 40px;
      color: #eaeef5;
      background: rgba(255,255,255,.08);
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      transition: all .2s;
    }
    .controls button:hover { background: rgba(255,255,255,.18); transform: scale(1.03); }
    .upload {
      margin-top: 16px;
      padding: 12px 26px;
      border-radius: 40px;
      color: white;
      background: linear-gradient(135deg,#6a5acd,#8a7bdd);
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,.2);
      box-shadow: 0 4px 15px rgba(106,90,205,.4);
    }
    .upload:hover { transform: translateY(-2px); }
    .upload input { display: none; }
    .status {
      margin-top: 12px;
      color: #b0b8c5;
      font-size: .85rem;
      text-align: center;
      max-width: 560px;
      line-height: 1.6;
    }
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #eaeef5;
      font-size: 1rem;
      pointer-events: none;
      z-index: 10;
    }
    .debug {
      margin-top: 10px;
      padding: 10px 16px;
      border-radius: 12px;
      background: rgba(0,0,0,.35);
      color: #a8b2c1;
      font-family: monospace;
      font-size: .75rem;
      max-width: 560px;
      max-height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
      direction: ltr;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="loading" id="loading">جاري تحميل نموذج الرأس...</div>
  </div>

  <nav class="controls">
    <button id="leftBtn">← يسار</button>
    <button id="upBtn">↑ أعلى</button>
    <button id="rightBtn">→ يمين</button>
    <button id="resetBtn">⟲ إعادة</button>
  </nav>

  <label class="upload" for="faceUpload">
    📷 اختر صورة الوجه
    <input type="file" id="faceUpload" accept="image/*">
  </label>

  <p class="status" id="status">
    💡 ارفع صورة وجهك (PNG شفافة مثالية) — ستُطبَّق على الوجه فقط.
  </p>

  <div class="debug" id="debug" style="display:none"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const sceneEl = document.getElementById('scene');
    const loadingEl = document.getElementById('loading');
    const status = document.getElementById('status');
    const debugEl = document.getElementById('debug');
    const faceUpload = document.getElementById('faceUpload');

    // ============================================================
    // المشهد
    // ============================================================
    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(
      30,
      sceneEl.clientWidth / sceneEl.clientHeight,
      0.1,
      100
    );
    camera.position.set(0, 0, 3.5);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      preserveDrawingBuffer: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    sceneEl.appendChild(renderer.domElement);

    // إضاءة
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.3));

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
    keyLight.position.set(-2, 3, 4);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xccddff, 1.0);
    fillLight.position.set(3, 1, 3);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffd4a8, 1.5);
    rimLight.position.set(1, 2, -3);
    scene.add(rimLight);

    const backLight = new THREE.DirectionalLight(0xffffff, 0.6);
    backLight.position.set(0, 1, -5);
    scene.add(backLight);

    const headGroup = new THREE.Group();
    scene.add(headGroup);

    // ============================================================
    // تحميل النموذج
    // ============================================================
    const MODEL_URL = 'https://threejs.org/examples/models/gltf/LeePerrySmith/LeePerrySmith.glb';

    let headModel = null;
    let faceMesh = null;       // ✅ الـ mesh الذي يحمل الوجه فقط
    let debugInfo = [];

    const loader = new GLTFLoader();

    loader.load(
      MODEL_URL,
      (gltf) => {
        headModel = gltf.scene;
        headModel.scale.setScalar(0.35);
        headModel.position.set(0, -0.1, 0);

        // ============================================================
        // ✅ تحليل النموذج واختيار mesh الوجه فقط
        // ============================================================
        const allMeshes = [];

        headModel.traverse((child) => {
          if (child.isMesh && child.material) {
            allMeshes.push(child);
            debugInfo.push(`Mesh: "${child.name || 'unnamed'}"`);
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach(m => {
              debugInfo.push(`  Material: "${m.name || 'unnamed'}" | map: ${m.map ? '✓' : '✗'}`);
            });

            const materials = Array.isArray(child.material)
              ? child.material
              : [child.material];
            materials.forEach((mat) => {
              mat.roughness = 0.78;
              mat.metalness = 0.0;
              mat.needsUpdate = true;
            });
          }
        });

        // ✅ اختيار mesh الوجه — الأول الذي يحمل خريطة (map)
        // أو الأول في القائمة إن لم يوجد
        faceMesh = allMeshes.find(m => {
          const mats = Array.isArray(m.material) ? m.material : [m.material];
          return mats.some(mat => mat.map);
        }) || allMeshes[0];

        debugInfo.push(`\n→ اخترنا mesh الوجه: "${faceMesh?.name || 'unnamed'}"`);
        console.log(debugInfo.join('\n'));

        // عرض التفاصيل إذا أردت
        // debugEl.style.display = 'block';
        // debugEl.textContent = debugInfo.join('\n');

        headGroup.add(headModel);
        loadingEl.style.display = 'none';
        status.textContent = `✅ الرأس جاهز. mesh الوجه: "${faceMesh?.name || 'unnamed'}"`;
      },
      (progress) => {
        if (progress.total > 0) {
          const percent = Math.round((progress.loaded / progress.total) * 100);
          loadingEl.textContent = `جاري التحميل... ${percent}%`;
        }
      },
      (error) => {
        console.error(error);
        loadingEl.textContent = 'تعذر تحميل النموذج.';
        status.textContent = '❌ فشل تحميل النموذج.';
      }
    );

    // ============================================================
    // ✅ تطبيق الصورة على mesh الوجه فقط
    // ============================================================
    faceUpload.addEventListener('change', (event) => {
      const file = event.target.files?.[0];
      if (!file) return;

      if (!faceMesh) {
        status.textContent = '⏳ انتظر تحميل النموذج أولاً.';
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const texture = new THREE.Texture(img);
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
          texture.flipY = true;
          texture.wrapS = THREE.ClampToEdgeWrapping;
          texture.wrapT = THREE.ClampToEdgeWrapping;
          texture.needsUpdate = true;

          // ✅ تطبيق الصورة على mesh الوجه فقط
          const materials = Array.isArray(faceMesh.material)
            ? faceMesh.material
            : [faceMesh.material];

          materials.forEach((mat) => {
            mat.map = texture;
            mat.needsUpdate = true;
          });

          status.textContent = `✅ تم تطبيق صورتك على الوجه فقط (${faceMesh.name || 'unnamed'}).`;
        };
        img.onerror = () => {
          status.textContent = '❌ تعذر قراءة الصورة.';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    // ============================================================
    // دوران
    // ============================================================
    let isDragging = false;
    let prevX = 0, prevY = 0;
    let rotY = 0, rotX = 0;
    let targetRotY = 0, targetRotX = 0;

    const MAX_Y = 0.6, MAX_X = 0.35;
    const SMOOTH = 0.12;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    sceneEl.addEventListener('pointerdown', (e) => {
      isDragging = true;
      prevX = e.clientX;
      prevY = e.clientY;
      sceneEl.setPointerCapture(e.pointerId);
    });

    sceneEl.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - prevX;
      const dy = e.clientY - prevY;
      targetRotY = clamp(targetRotY + dx * 0.008, -MAX_Y, MAX_Y);
      targetRotX = clamp(targetRotX + dy * 0.006, -MAX_X, MAX_X);
      prevX = e.clientX;
      prevY = e.clientY;
    });

    const stopDrag = (e) => {
      isDragging = false;
      if (e && e.pointerId) {
        try { sceneEl.releasePointerCapture(e.pointerId); } catch(_) {}
      }
    };
    sceneEl.addEventListener('pointerup', stopDrag);
    sceneEl.addEventListener('pointercancel', stopDrag);

    document.getElementById('leftBtn').addEventListener('click', () => {
      targetRotY = clamp(targetRotY - 0.2, -MAX_Y, MAX_Y);
    });
    document.getElementById('rightBtn').addEventListener('click', () => {
      targetRotY = clamp(targetRotY + 0.2, -MAX_Y, MAX_Y);
    });
    document.getElementById('upBtn').addEventListener('click', () => {
      targetRotX = clamp(targetRotX - 0.15, -MAX_X, MAX_X);
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      targetRotY = 0;
      targetRotX = 0;
    });

    // ============================================================
    // حلقة الرسم
    // ============================================================
    function animate() {
      requestAnimationFrame(animate);
      rotY += (targetRotY - rotY) * SMOOTH;
      rotX += (targetRotX - rotX) * SMOOTH;
      headGroup.rotation.y = rotY;
      headGroup.rotation.x = rotX;
      renderer.render(scene, camera);
    }
    animate();

    function resize() {
      const w = sceneEl.clientWidth;
      const h = sceneEl.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }
    new ResizeObserver(resize).observe(sceneEl);
    resize();

    window.addEventListener('beforeunload', () => {
      renderer.dispose();
    });
  </script>
</body>
</html>
