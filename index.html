<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1e2b">
  <title>رأس إنسان ثلاثي الأبعاد</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      color: #eaeef5;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: radial-gradient(ellipse at 50% 36%, #343b51 0%, #252b3b 46%, #171b26 100%);
    }
    .scene {
      width: 100%;
      max-width: 700px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
    }
    .face-container {
      position: relative;
      width: min(420px, 88vw);
      height: min(500px, 64vh);
      min-height: 360px;
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      filter: drop-shadow(0 30px 30px rgba(0,0,0,.34));
    }
    .face-container:active { cursor: grabbing; }
    .face-container canvas { display: block; width: 100%; height: 100%; outline: none; }
    .controls {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      padding: 13px 20px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 60px;
      background: rgba(20,24,33,.72);
      box-shadow: 0 15px 35px rgba(0,0,0,.36);
      backdrop-filter: blur(10px);
    }
    .controls button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 40px;
      color: #eaeef5;
      background: rgba(255,255,255,.08);
      box-shadow: 0 4px 10px rgba(0,0,0,.22);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s, transform .2s, border-color .2s;
    }
    .controls button:hover { background: rgba(255,255,255,.18); transform: scale(1.03); border-color: rgba(255,255,255,.3); }
    .controls button:active { transform: scale(.98); }
    .controls button i { font-style: normal; font-size: 1.2rem; }
    .upload-section {
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 40px;
      background: rgba(20,24,33,.72);
      box-shadow: 0 10px 25px rgba(0,0,0,.3);
      backdrop-filter: blur(10px);
    }
    .upload-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 40px;
      color: white;
      background: linear-gradient(135deg,#6a5acd,#8a7bdd);
      box-shadow: 0 4px 15px rgba(106,90,205,.38);
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }
    .upload-label:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(106,90,205,.55); }
    .upload-label input { display: none; }
    .hint {
      max-width: min(540px, 92vw);
      margin-top: 14px;
      padding: 9px 17px;
      border-radius: 30px;
      color: #b0b8c5;
      background: rgba(0,0,0,.26);
      font-size: .84rem;
      line-height: 1.6;
      text-align: center;
    }
    .status { min-height: 1.3em; margin-top: 6px; color: #d4d9e2; font-size: .8rem; text-align: center; }
    @media (max-width: 480px) {
      body { padding: 12px; }
      .face-container { height: min(460px, 59vh); min-height: 330px; }
      .controls { gap: 8px; padding: 10px 12px; }
      .controls button { padding: 9px 13px; font-size: .9rem; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="عارض رأس إنسان ثلاثي الأبعاد">
    <div class="face-container" id="faceContainer" role="img" aria-label="رأس بيضوي ثلاثي الأبعاد قابل للدوران"></div>
  </main>

  <nav class="controls" aria-label="أدوات تدوير الرأس">
    <button id="leftBtn" title="تحريك لليسار"><i>←</i> يسار</button>
    <button id="upBtn" title="إمالة الرأس"><i>↑</i> أعلى</button>
    <button id="rightBtn" title="تحريك لليمين"><i>→</i> يمين</button>
    <button id="resetBtn" title="إعادة تعيين"><i>⟲</i> إعادة</button>
  </nav>

  <section class="upload-section" aria-label="رفع صورة">
    <label class="upload-label" for="imageUpload">
      <span aria-hidden="true">📷</span> اختر صورة وجهك
      <input type="file" id="imageUpload" accept="image/*">
    </label>
  </section>
  <p class="hint">رأس بيضوي مقلوب: الأعلى عريض والأسفل مدبّب. الصورة تغطي السطح بالكامل بدون أي حواف ظاهرة.</p>
  <p class="status" id="status" aria-live="polite"></p>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';

    const container = document.getElementById('faceContainer');
    const upload = document.getElementById('imageUpload');
    const status = document.getElementById('status');

    // ============================================================
    // إعداد المشهد
    // ============================================================
    const scene = new THREE.Scene();
    scene.background = null;

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 50);
    camera.position.set(0, 0.05, 5.6);

    // إضاءة
    scene.add(new THREE.HemisphereLight(0xe5edff, 0x453326, 1.9));

    const keyLight = new THREE.DirectionalLight(0xffe2ca, 2.8);
    keyLight.position.set(-3.5, 4.5, 5.0);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xc6d5ff, 1.2);
    fillLight.position.set(4.0, 1.0, 3.0);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffcda9, 1.6);
    rimLight.position.set(1.5, 3.0, -3.0);
    scene.add(rimLight);

    const headGroup = new THREE.Group();
    scene.add(headGroup);

    // ============================================================
    // إعداد القماش (Canvas) للنقش على السطح
    // ============================================================
    const TEX_W = 2048, TEX_H = 2048; // مربع لتفادي تشوه الصورة
    const skinCanvas = document.createElement('canvas');
    skinCanvas.width = TEX_W;
    skinCanvas.height = TEX_H;
    const skinCtx = skinCanvas.getContext('2d');

    let currentPhoto = null;
    let headTexture;

    // رسم الصورة لتغطي مساحة معينة (cover)
    function drawCover(ctx, image, x, y, width, height) {
      const scale = Math.max(width / image.width, height / image.height);
      const sw = width / scale, sh = height / scale;
      const sx = (image.width - sw) / 2;
      const sy = (image.height - sh) / 2;
      ctx.drawImage(image, sx, sy, sw, sh, x, y, width, height);
    }

    // استخراج لون خلفية الرأس من أعلى الصورة
    function sampleBackColor(image) {
      try {
        const sample = document.createElement('canvas');
        sample.width = 64; sample.height = 64;
        const ctx = sample.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(image, 0, 0, 64, 64);
        const pixels = ctx.getImageData(20, 1, 24, 15).data;
        let r = 0, g = 0, b = 0, count = 0;
        for (let i = 0; i < pixels.length; i += 4) {
          if (pixels[i + 3] < 20) continue;
          r += pixels[i]; g += pixels[i + 1]; b += pixels[i + 2]; count++;
        }
        if (!count) return '#4a3e38';
        return `rgb(${Math.round(r/count)},${Math.round(g/count)},${Math.round(b/count)})`;
      } catch {
        return '#4a3e38';
      }
    }

    // ============================================================
    // رسم النقش على القماش
    // الصورة تغطي الوجه بالكامل + امتداد خفيف للجوانب
    // ============================================================
    function paintHeadTexture() {
      const backTone = currentPhoto ? sampleBackColor(currentPhoto) : '#4a3e38';
      skinCtx.fillStyle = backTone;
      skinCtx.fillRect(0, 0, TEX_W, TEX_H);

      // تدرج خفيف للعمق
      const shade = skinCtx.createLinearGradient(0, 0, 0, TEX_H);
      shade.addColorStop(0, 'rgba(255,255,255,.06)');
      shade.addColorStop(.5, 'rgba(0,0,0,0)');
      shade.addColorStop(1, 'rgba(0,0,0,.12)');
      skinCtx.fillStyle = shade;
      skinCtx.fillRect(0, 0, TEX_W, TEX_H);

      if (currentPhoto) {
        // ✅ الصورة تغطي أكثر من نصف القماش بقليل
        // الوجه الأمامي = الجزء الأوسط من UV (u من 0.25 إلى 0.75)
        // الصورة تغطي من u=0.22 إلى u=0.78 (56% من العرض) لتضمن تغطية كاملة
        const frontX = TEX_W * 0.22;
        const frontW = TEX_W * 0.56;

        // طبقة الصورة
        const imageLayer = document.createElement('canvas');
        imageLayer.width = TEX_W;
        imageLayer.height = TEX_H;
        const imageCtx = imageLayer.getContext('2d');

        // رسم الصورة لتغطي المنطقة الأمامية بالكامل (تمتد من أعلى إلى أسفل)
        drawCover(imageCtx, currentPhoto, frontX, 0, frontW, TEX_H);
        skinCtx.drawImage(imageLayer, frontX, 0, frontW, TEX_H, frontX, 0, frontW, TEX_H);

        // امتداد لوني على الجانبين بلون الشعر/الحدود
        const sideW = TEX_W * 0.06;
        for (const side of ['left', 'right']) {
          const isLeft = side === 'left';
          const band = document.createElement('canvas');
          band.width = Math.ceil(sideW);
          band.height = TEX_H;
          const bandCtx = band.getContext('2d');

          const srcX = isLeft ? frontX : frontX + frontW - 1;
          bandCtx.drawImage(imageLayer, srcX, 0, 1, TEX_H, 0, 0, band.width, TEX_H);

          // تلاشي
          const fade = bandCtx.createLinearGradient(0, 0, band.width, 0);
          if (isLeft) {
            fade.addColorStop(0, 'rgba(255,255,255,0)');
            fade.addColorStop(1, 'rgba(255,255,255,1)');
          } else {
            fade.addColorStop(0, 'rgba(255,255,255,1)');
            fade.addColorStop(1, 'rgba(255,255,255,0)');
          }
          bandCtx.globalCompositeOperation = 'destination-in';
          bandCtx.fillStyle = fade;
          bandCtx.fillRect(0, 0, band.width, TEX_H);

          const destX = isLeft ? frontX - sideW : frontX + frontW;
          skinCtx.drawImage(band, destX, 0, sideW, TEX_H);
        }
      }

      if (headTexture) headTexture.needsUpdate = true;
    }

    headTexture = new THREE.CanvasTexture(skinCanvas);
    headTexture.colorSpace = THREE.SRGBColorSpace;
    headTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
    paintHeadTexture();

    // ============================================================
    // ✅ الشكل البيضوي المقلوب + أصغر من حجم الصورة
    //
    // ملاحظة مهمة:
    // - UV mapping الحالي يضع صورة الوجه في u=0.22..0.78
    // - الشكل البيضوي يشغل u=0.0..1.0 من الهندسة
    // - لضمان تغطية كاملة، نستخدم نصف قطر عرض أوسع قليلاً
    //   بحيث يظهر الوجه على كامل الواجهة الأمامية
    // ============================================================
    function makeHeadGeometry() {
      const around = 192;
      const vertical = 200;

      const positions = [];
      const uvs = [];
      const indices = [];

      // ✅ نصف الأبعاد: العرض والعمق
      const rx = 1.0;   // عرض الرأس
      const rz = 0.78;  // عمق الرأس
      const halfHeight = 1.35;

      for (let j = 0; j <= vertical; j++) {
        const v = j / vertical;

        // ✅ الإحداثي الرأسي: y = -halfHeight (أسفل) → +halfHeight (أعلى)
        const y = (v - 0.5) * 2 * halfHeight;
        const yn = y / halfHeight;

        // نصف قطر المقطع الأفقي (يعتمد على y)
        // الشكل البيضوي المقلوب:
        //   - عند الأعلى (yn = +1): عريض جداً (قمة الرأس)
        //   - في المنتصف (yn = 0): العرض الكامل
        //   - عند الأسفل (yn = -1): يضيق تدريجياً نحو الذقن
        let ring;
        if (yn >= 0) {
          // النصف العلوي (الجمجمة): شكل شبه كروي عريض
          // قمة الرأس عريضة ومسطحة قليلاً
          ring = Math.pow(Math.max(0, 1 - yn * yn), 0.42);
        } else {
          // النصف السفلي (الفك): يضيق بشكل أسرع قليلاً
          // الذقن مدبب أكثر من قمة الرأس
          ring = Math.pow(Math.max(0, 1 - yn * yn), 0.62);
        }

        // ✅ نحفظ النسب الحقيقية بدون تصغير الشكل عن الصورة
        // لكن نجعل الشكل أصغر قليلاً من حدود UV القصوى
        // حتى لا تظهر أي حواف مكشوفة
        const widthFactor = ring;

        for (let i = 0; i <= around; i++) {
          const u = i / around;
          const theta = (u - 0.5) * Math.PI * 2;
          const s = Math.sin(theta);
          const c = Math.cos(theta);

          // ✅ x: نصف العرض * نصف قطر المقطع * معامل الضيق
          const x = rx * widthFactor * s;

          // ✅ z: نصف العمق * نصف قطر المقطع
          // نضيف بعض الاختلاف حسب الجبهة/الفك
          let z = rz * widthFactor * c;

          // ✅ إضافة تفاصيل الوجه الدقيقة (أنف، وجنتين، فك)
          // تُطبق فقط على الجهة الأمامية (c > 0 يعني z موجب = أمام)
          if (c > 0) {
            const front = Math.pow(c, 5);
            const g = (cx, cy, wx, wy) =>
              Math.exp(
                -Math.pow((x - cx) / wx, 2) -
                Math.pow((y - cy) / wy, 2)
              );

            let relief = 0;

            // الجبهة
            relief += 0.028 * g(0, 0.55, 0.6, 0.35);

            // الأنف (جسر + رأس الأنف)
            relief += 0.032 * g(0, 0.10, 0.09, 0.35);   // الجسر
            relief += 0.052 * g(0, -0.18, 0.14, 0.14);  // رأس الأنف

            // الوجنتين
            relief += 0.025 * (g(-0.45, -0.05, 0.22, 0.22) + g(0.45, -0.05, 0.22, 0.22));

            // الفك السفلي
            relief += 0.018 * g(0, -0.75, 0.35, 0.20);

            // تجويف العين (انخفاض خفيف)
            relief -= 0.010 * (g(-0.28, 0.28, 0.17, 0.10) + g(0.28, 0.28, 0.17, 0.10));

            z += front * relief;
          }

          positions.push(x, y, z);
          uvs.push(u, v);

          // بناء المثلثات
          if (j < vertical && i < around) {
            const a = j * (around + 1) + i;
            const b = a + around + 1;
            indices.push(a, a + 1, b, b, a + 1, b + 1);
          }
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    const skinMaterial = new THREE.MeshStandardMaterial({
      map: headTexture,
      color: 0xffffff,
      roughness: 0.82,
      metalness: 0,
      side: THREE.FrontSide  // ✅ FrontSide فقط لأن الشكل مغلق
    });

    const head = new THREE.Mesh(makeHeadGeometry(), skinMaterial);
    headGroup.add(head);

    // ============================================================
    // دوران
    // ============================================================
    let rotY = 0, rotX = 0;
    let targetRotY = 0, targetRotX = 0;

    const MAX_Y = 38, MAX_X = 24;
    const SMOOTH = 0.12;
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    let dragging = false;
    let startX = 0, startY = 0;
    let startRotY = 0, startRotX = 0;

    function resize() {
      const width = Math.max(1, container.clientWidth);
      const height = Math.max(1, container.clientHeight);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.position.z = width < 360 ? 6.2 : 5.6;
      camera.updateProjectionMatrix();
    }

    new ResizeObserver(resize).observe(container);
    window.addEventListener('resize', resize);
    resize();

    function animate() {
      requestAnimationFrame(animate);
      rotY += (targetRotY - rotY) * SMOOTH;
      rotX += (targetRotX - rotX) * SMOOTH;
      headGroup.rotation.set(
        THREE.MathUtils.degToRad(rotX),
        THREE.MathUtils.degToRad(rotY),
        0
      );
      renderer.render(scene, camera);
    }
    animate();

    // ============================================================
    // أزرار التحكم
    // ============================================================
    document.getElementById('leftBtn').addEventListener('click', () => {
      targetRotY = clamp(targetRotY - 8, -MAX_Y, MAX_Y);
    });
    document.getElementById('rightBtn').addEventListener('click', () => {
      targetRotY = clamp(targetRotY + 8, -MAX_Y, MAX_Y);
    });
    document.getElementById('upBtn').addEventListener('click', () => {
      targetRotX = clamp(targetRotX + 6, -MAX_X, MAX_X);
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      targetRotY = 0;
      targetRotX = 0;
    });

    // ============================================================
    // السحب بالفأرة/اللمس
    // ============================================================
    container.addEventListener('pointerdown', (event) => {
      if (event.target !== renderer.domElement) return;
      dragging = true;
      startX = event.clientX;
      startY = event.clientY;
      startRotY = targetRotY;
      startRotX = targetRotX;
      container.setPointerCapture?.(event.pointerId);
      event.preventDefault();
    });

    container.addEventListener('pointermove', (event) => {
      if (!dragging) return;
      targetRotY = clamp(startRotY + (event.clientX - startX) * 0.48, -MAX_Y, MAX_Y);
      targetRotX = clamp(startRotX - (event.clientY - startY) * 0.38, -MAX_X, MAX_X);
    });

    const stopDrag = () => { dragging = false; };
    container.addEventListener('pointerup', stopDrag);
    container.addEventListener('pointercancel', stopDrag);
    container.addEventListener('lostpointercapture', stopDrag);

    // ============================================================
    // رفع صورة
    // ============================================================
    let userUploadedPhoto = false;

    upload.addEventListener('change', (event) => {
      const file = event.target.files?.[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        alert('الرجاء اختيار ملف صورة صالح');
        upload.value = '';
        return;
      }

      const image = new Image();
      image.onload = () => {
        userUploadedPhoto = true;
        currentPhoto = image;
        paintHeadTexture();
        status.textContent = 'تم تطبيق الصورة على سطح الرأس ثلاثي الأبعاد.';
        URL.revokeObjectURL(image.src);
      };
      image.onerror = () => {
        status.textContent = 'تعذر تحميل الصورة. جرّب ملف صورة آخر.';
        URL.revokeObjectURL(image.src);
      };
      image.src = URL.createObjectURL(file);
    });

    // صورة افتراضية
    const sample = new Image();
    sample.crossOrigin = 'anonymous';
    sample.onload = () => {
      if (!userUploadedPhoto) {
        currentPhoto = sample;
        paintHeadTexture();
      }
    };
    sample.onerror = () => {};
    sample.src = 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=600&auto=format&fit=crop&q=80&ixlib=rb-4.0.3';

    window.addEventListener('beforeunload', () => {
      headTexture.dispose();
      skinMaterial.dispose();
      renderer.dispose();
    });
  </script>
</body>
</html>
