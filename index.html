<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1e2b">
  <title>رأس إنسان ثلاثي الأبعاد</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      color: #eaeef5;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: radial-gradient(ellipse at 50% 36%, #343b51 0%, #252b3b 46%, #171b26 100%);
    }
    .scene {
      width: 100%;
      max-width: 700px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
    }
    .face-container {
      position: relative;
      width: min(420px, 88vw);
      height: min(500px, 64vh);
      min-height: 360px;
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      filter: drop-shadow(0 30px 30px rgba(0,0,0,.34));
    }
    .face-container:active { cursor: grabbing; }
    .face-container canvas { display: block; width: 100%; height: 100%; outline: none; }
    .controls {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      padding: 13px 20px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 60px;
      background: rgba(20,24,33,.72);
      box-shadow: 0 15px 35px rgba(0,0,0,.36);
      backdrop-filter: blur(10px);
    }
    .controls button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 40px;
      color: #eaeef5;
      background: rgba(255,255,255,.08);
      box-shadow: 0 4px 10px rgba(0,0,0,.22);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s, transform .2s, border-color .2s;
    }
    .controls button:hover { background: rgba(255,255,255,.18); transform: scale(1.03); border-color: rgba(255,255,255,.3); }
    .controls button:active { transform: scale(.98); }
    .controls button i { font-style: normal; font-size: 1.2rem; }
    .upload-section {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 40px;
      background: rgba(20,24,33,.72);
      box-shadow: 0 10px 25px rgba(0,0,0,.3);
      backdrop-filter: blur(10px);
    }
    .upload-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 40px;
      color: white;
      background: linear-gradient(135deg,#6a5acd,#8a7bdd);
      box-shadow: 0 4px 15px rgba(106,90,205,.38);
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }
    .upload-label.side {
      background: linear-gradient(135deg,#4a7a6a,#6aa08d);
      box-shadow: 0 4px 15px rgba(74,122,106,.38);
    }
    .upload-label:hover { transform: translateY(-2px); }
    .upload-label input { display: none; }
    .upload-status {
      font-size: .75rem;
      color: #9ba3b0;
      min-width: 60px;
      text-align: center;
    }
    .upload-status.ready { color: #7ed4a8; }
    .hint {
      max-width: min(560px, 92vw);
      margin-top: 14px;
      padding: 9px 17px;
      border-radius: 30px;
      color: #b0b8c5;
      background: rgba(0,0,0,.26);
      font-size: .82rem;
      line-height: 1.6;
      text-align: center;
    }
    .status { min-height: 1.3em; margin-top: 6px; color: #d4d9e2; font-size: .8rem; text-align: center; }
    @media (max-width: 480px) {
      body { padding: 12px; }
      .face-container { height: min(460px, 59vh); min-height: 330px; }
      .controls { gap: 8px; padding: 10px 12px; }
      .controls button { padding: 9px 13px; font-size: .9rem; }
      .upload-label { padding: 9px 15px; font-size: .82rem; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="عارض رأس إنسان ثلاثي الأبعاد">
    <div class="face-container" id="faceContainer" role="img" aria-label="رأس بيضوي ثلاثي الأبعاد قابل للدوران"></div>
  </main>

  <nav class="controls" aria-label="أدوات تدوير الرأس">
    <button id="leftBtn" title="تحريك لليسار"><i>←</i> يسار</button>
    <button id="upBtn" title="إمالة الرأس"><i>↑</i> أعلى</button>
    <button id="rightBtn" title="تحريك لليمين"><i>→</i> يمين</button>
    <button id="resetBtn" title="إعادة تعيين"><i>⟲</i> إعادة</button>
  </nav>

  <section class="upload-section" aria-label="رفع الصور">
    <label class="upload-label" for="faceUpload">
      <span aria-hidden="true">🙂</span> صورة الوجه الأمامي
      <input type="file" id="faceUpload" accept="image/*">
    </label>
    <span class="upload-status" id="faceStatus">لم تُرفع</span>

    <label class="upload-label side" for="sideUpload">
      <span aria-hidden="true">💇</span> صورة الشعر / الجوانب
      <input type="file" id="sideUpload" accept="image/*">
    </label>
    <span class="upload-status" id="sideStatus">لم تُرفع</span>
  </section>

  <p class="hint">
    ارفع صورتين منفصلتين: الأولى للوجه الأمامي، والثانية للشعر والجوانب. كل صورة تُعرض كما هي بدون أي تغيير.
  </p>
  <p class="status" id="status" aria-live="polite"></p>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';

    const container = document.getElementById('faceContainer');
    const faceUpload = document.getElementById('faceUpload');
    const sideUpload = document.getElementById('sideUpload');
    const faceStatus = document.getElementById('faceStatus');
    const sideStatus = document.getElementById('sideStatus');
    const status = document.getElementById('status');

    // ============================================================
    // المشهد
    // ============================================================
    const scene = new THREE.Scene();
    scene.background = null;

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.02;
    container.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 50);
    camera.position.set(0, 0.05, 5.6);

    scene.add(new THREE.HemisphereLight(0xe5edff, 0x453326, 1.85));

    const keyLight = new THREE.DirectionalLight(0xffe2ca, 2.6);
    keyLight.position.set(-3.5, 4.5, 5.0);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xc6d5ff, 1.15);
    fillLight.position.set(4.0, 1.0, 3.0);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffcda9, 1.5);
    rimLight.position.set(1.5, 3.0, -3.0);
    scene.add(rimLight);

    const headGroup = new THREE.Group();
    scene.add(headGroup);

    // ============================================================
    // القماش
    // ============================================================
    const TEX_W = 2048;
    const TEX_H = 2048;

    const skinCanvas = document.createElement('canvas');
    skinCanvas.width = TEX_W;
    skinCanvas.height = TEX_H;
    const skinCtx = skinCanvas.getContext('2d');

    let facePhoto = null;   // صورة الوجه الأمامي
    let sidePhoto = null;   // صورة الشعر / الجوانب
    let headTexture;

    // ============================================================
    // ✅ رسم صورة داخل مستطيل بنمط cover
    //    - تحافظ على نسبة الأبعاد
    //    - تكبّر الصورة حتى تغطي المستطيل بالكامل
    //    - تقص الأجزاء الزائدة على الحواف فقط
    //    - الصورة نفسها لا تُشوَّه أبداً
    // ============================================================
    function drawImageCover(ctx, image, destX, destY, destW, destH) {
      const imgW = image.width;
      const imgH = image.height;
      const imgAspect = imgW / imgH;
      const destAspect = destW / destH;

      let srcX, srcY, srcW, srcH;
      if (imgAspect > destAspect) {
        // الصورة أعرض من الهدف → نقص الجانبين
        srcH = imgH;
        srcW = imgH * destAspect;
        srcX = (imgW - srcW) / 2;
        srcY = 0;
      } else {
        // الصورة أطول من الهدف → نقص الأعلى والأسفل
        srcW = imgW;
        srcH = imgW / destAspect;
        srcX = 0;
        srcY = (imgH - srcH) / 2;
      }

      ctx.drawImage(
        image,
        srcX, srcY, srcW, srcH,
        destX, destY, destW, destH
      );
    }

    // ============================================================
    // ✅ حساب ألوان الحواف (لدمج الصورتين بدون خط فاصل)
    // ============================================================
    function extractColumnColors(image, xRatio, sampleH = 128) {
      const sampleW = 512;
      const sampleH_canvas = 512;

      const sample = document.createElement('canvas');
      sample.width = sampleW;
      sample.height = sampleH_canvas;
      const ctx = sample.getContext('2d', { willReadFrequently: true });

      ctx.drawImage(image, 0, 0, sampleW, sampleH_canvas);

      const px = Math.min(sampleW - 1, Math.max(0, Math.floor(xRatio * sampleW)));
      const data = ctx.getImageData(px, 0, 1, sampleH_canvas).data;

      const colors = [];
      for (let i = 0; i < sampleH; i++) {
        const sy = Math.floor((i / sampleH) * (sampleH_canvas - 1));
        const si = sy * 4;
        colors.push({
          r: data[si],
          g: data[si + 1],
          b: data[si + 2]
        });
      }
      return colors;
    }

    // ============================================================
    // ✅ رسم القماش النهائي
    //
    // التخطيط:
    //  ┌─────────────┬──────────────┬─────────────┐
    //  │  الجانب    │    الوجه     │   الجانب    │
    //  │  الأيسر    │   الأمامي    │   الأيمن    │
    //  │  u=0→0.25  │  u=0.25→0.75 │ u=0.75→1.0  │
    //  └─────────────┴──────────────┴─────────────┘
    //
    // كل صورة تُرسم في منطقتها فقط بنمط cover
    // ثم نضيف منطقة دمج صغيرة بينهما (بدون خط واضح)
    // ============================================================
    function paintHeadTexture() {
      skinCtx.clearRect(0, 0, TEX_W, TEX_H);

      // 1) خلفية افتراضية
      skinCtx.fillStyle = '#3a3230';
      skinCtx.fillRect(0, 0, TEX_W, TEX_H);

      // 2) منطقة الوجه (النصف الأوسط من UV)
      const faceX = TEX_W * 0.25;
      const faceW = TEX_W * 0.50;
      const faceY = 0;
      const faceH = TEX_H;

      // 3) منطقتا الجانبين
      const sideLeftX = 0;
      const sideLeftW = TEX_W * 0.25;
      const sideRightX = TEX_W * 0.75;
      const sideRightW = TEX_W * 0.25;

      // ============================================================
      // رسم صورة الوجه الأمامي (كما هي، بنمط cover في منطقتها)
      // ============================================================
      if (facePhoto) {
        drawImageCover(skinCtx, facePhoto, faceX, faceY, faceW, faceH);
      } else {
        // خلفية لون بشرة افتراضية
        skinCtx.fillStyle = '#d9bfa8';
        skinCtx.fillRect(faceX, faceY, faceW, faceH);
      }

      // ============================================================
      // رسم صورة الجوانب (كما هي، بنمط cover في المنطقة اليسرى واليمنى)
      // نرسمها في المنطقة اليسرى واليمنى بنفس الصورة
      // ============================================================
      if (sidePhoto) {
        // الجانب الأيسر
        drawImageCover(skinCtx, sidePhoto, sideLeftX, 0, sideLeftW, TEX_H);

        // الجانب الأيمن - نعكس الصورة أفقياً ليبدو الشعر طبيعياً من الجهتين
        skinCtx.save();
        skinCtx.translate(sideRightX + sideRightW, 0);
        skinCtx.scale(-1, 1);
        drawImageCover(skinCtx, sidePhoto, 0, 0, sideRightW, TEX_H);
        skinCtx.restore();
      } else if (facePhoto) {
        // في حال عدم رفع صورة الجوانب، نملأ الجانبين بلون مستخرج من حواف الوجه
        const leftColors = extractColumnColors(facePhoto, 0.0, 128);
        const rightColors = extractColumnColors(facePhoto, 1.0, 128);

        const leftBand = document.createElement('canvas');
        leftBand.width = 4;
        leftBand.height = TEX_H;
        const lbCtx = leftBand.getContext('2d');
        const leftImg = lbCtx.createImageData(4, TEX_H);
        for (let y = 0; y < TEX_H; y++) {
          const ci = Math.floor((y / TEX_H) * (leftColors.length - 1));
          const col = leftColors[ci];
          for (let x = 0; x < 4; x++) {
            const di = (y * 4 + x) * 4;
            leftImg.data[di] = col.r;
            leftImg.data[di + 1] = col.g;
            leftImg.data[di + 2] = col.b;
            leftImg.data[di + 3] = 255;
          }
        }
        lbCtx.putImageData(leftImg, 0, 0);
        skinCtx.drawImage(leftBand, 0, 0, 4, TEX_H, 0, 0, sideLeftW, TEX_H);

        const rightBand = document.createElement('canvas');
        rightBand.width = 4;
        rightBand.height = TEX_H;
        const rbCtx = rightBand.getContext('2d');
        const rightImg = rbCtx.createImageData(4, TEX_H);
        for (let y = 0; y < TEX_H; y++) {
          const ci = Math.floor((y / TEX_H) * (rightColors.length - 1));
          const col = rightColors[ci];
          for (let x = 0; x < 4; x++) {
            const di = (y * 4 + x) * 4;
            rightImg.data[di] = col.r;
            rightImg.data[di + 1] = col.g;
            rightImg.data[di + 2] = col.b;
            rightImg.data[di + 3] = 255;
          }
        }
        rbCtx.putImageData(rightImg, 0, 0);
        skinCtx.drawImage(rightBand, 0, 0, 4, TEX_H, sideRightX, 0, sideRightW, TEX_H);
      }

      // ============================================================
      // ✅ دمج ناعم عند الحدود بين الوجه والجانبين
      // نأخذ شريطاً ضيقاً من حدود صورة الوجه ونضعه كتدريج فوق الحد الفاصل
      // ============================================================
      if (facePhoto) {
        const blendW = TEX_W * 0.012; // عرض منطقة الدمج
        // نأخذ شريطاً رفيعاً من حدود صورة الوجه
        const edgeLeft = extractColumnColors(facePhoto, 0.0, 64);
        const edgeRight = extractColumnColors(facePhoto, 1.0, 64);

        // حدود اليسار (نهاية الجانب الأيسر)
        const blendLeft = document.createElement('canvas');
        blendLeft.width = Math.ceil(blendW);
        blendLeft.height = TEX_H;
        const blCtx = blendLeft.getContext('2d');
        const blImg = blCtx.createImageData(blendLeft.width, TEX_H);
        for (let y = 0; y < TEX_H; y++) {
          const ci = Math.floor((y / TEX_H) * (edgeLeft.length - 1));
          const col = edgeLeft[ci];
          for (let x = 0; x < blendLeft.width; x++) {
            // يتلاشى نحو الجانب
            const t = x / blendLeft.width;      // 0 في الملامسة للوجه
            const alpha = Math.round(255 * (1 - t));
            const di = (y * blendLeft.width + x) * 4;
            blImg.data[di] = col.r;
            blImg.data[di + 1] = col.g;
            blImg.data[di + 2] = col.b;
            blImg.data[di + 3] = alpha;
          }
        }
        blCtx.putImageData(blImg, 0, 0);
        // رسم الشريط على المنطقة الفاصلة (نهاية الجانب الأيسر)
        skinCtx.drawImage(blendLeft, 0, 0, blendLeft.width, TEX_H,
                          faceX - blendW, 0, blendW, TEX_H);

        // حدود اليمين
        const blendRight = document.createElement('canvas');
        blendRight.width = Math.ceil(blendW);
        blendRight.height = TEX_H;
        const brCtx = blendRight.getContext('2d');
        const brImg = brCtx.createImageData(blendRight.width, TEX_H);
        for (let y = 0; y < TEX_H; y++) {
          const ci = Math.floor((y / TEX_H) * (edgeRight.length - 1));
          const col = edgeRight[ci];
          for (let x = 0; x < blendRight.width; x++) {
            const t = x / blendRight.width;      // 0 في الملامسة للوجه
            const alpha = Math.round(255 * t);
            const di = (y * blendRight.width + x) * 4;
            brImg.data[di] = col.r;
            brImg.data[di + 1] = col.g;
            brImg.data[di + 2] = col.b;
            brImg.data[di + 3] = alpha;
          }
        }
        brCtx.putImageData(brImg, 0, 0);
        skinCtx.drawImage(blendRight, 0, 0, blendRight.width, TEX_H,
                          faceX + faceW, 0, blendW, TEX_H);
      }

      if (headTexture) headTexture.needsUpdate = true;
    }

    headTexture = new THREE.CanvasTexture(skinCanvas);
    headTexture.colorSpace = THREE.SRGBColorSpace;
    headTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
    headTexture.wrapS = THREE.RepeatWrapping;
    headTexture.wrapT = THREE.ClampToEdgeWrapping;
    paintHeadTexture();

    // ============================================================
    // ✅ الشكل البيضوي المقلوب
    // ============================================================
    function makeHeadGeometry() {
      const around = 192;
      const vertical = 200;

      const positions = [];
      const uvs = [];
      const indices = [];

      const rx = 1.0;
      const rz = 0.78;
      const halfHeight = 1.35;

      for (let j = 0; j <= vertical; j++) {
        const v = j / vertical;
        const y = (v - 0.5) * 2 * halfHeight;
        const yn = y / halfHeight;

        let ring;
        if (yn >= 0) {
          ring = Math.pow(Math.max(0, 1 - yn * yn), 0.42);
        } else {
          ring = Math.pow(Math.max(0, 1 - yn * yn), 0.62);
        }

        for (let i = 0; i <= around; i++) {
          const u = i / around;
          const theta = (u - 0.5) * Math.PI * 2;
          const s = Math.sin(theta);
          const c = Math.cos(theta);

          const x = rx * ring * s;
          let z = rz * ring * c;

          if (c > 0) {
            const front = Math.pow(c, 5);
            const g = (cx, cy, wx, wy) =>
              Math.exp(
                -Math.pow((x - cx) / wx, 2) -
                Math.pow((y - cy) / wy, 2)
              );

            let relief = 0;
            relief += 0.028 * g(0, 0.55, 0.6, 0.35);
            relief += 0.032 * g(0, 0.10, 0.09, 0.35);
            relief += 0.052 * g(0, -0.18, 0.14, 0.14);
            relief += 0.025 * (g(-0.45, -0.05, 0.22, 0.22) + g(0.45, -0.05, 0.22, 0.22));
            relief += 0.018 * g(0, -0.75, 0.35, 0.20);
            relief -= 0.010 * (g(-0.28, 0.28, 0.17, 0.10) + g(0.28, 0.28, 0.17, 0.10));

            z += front * relief;
          }

          positions.push(x, y, z);
          uvs.push(u, v);

          if (j < vertical && i < around) {
            const a = j * (around + 1) + i;
            const b = a + around + 1;
            indices.push(a, a + 1, b, b, a + 1, b + 1);
          }
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    const skinMaterial = new THREE.MeshStandardMaterial({
      map: headTexture,
      color: 0xffffff,
      roughness: 0.82,
      metalness: 0,
      side: THREE.FrontSide
    });

    const head = new THREE.Mesh(makeHeadGeometry(), skinMaterial);
    headGroup.add(head);

    // ============================================================
    // دوران
    // ============================================================
    let rotY = 0, rotX = 0;
    let targetRotY = 0, targetRotX = 0;

    const MAX_Y = 38, MAX_X = 24;
    const SMOOTH = 0.12;
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    let dragging = false;
    let startX = 0, startY = 0;
    let startRotY = 0, startRotX = 0;

    function resize() {
      const width = Math.max(1, container.clientWidth);
      const height = Math.max(1, container.clientHeight);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.position.z = width < 360 ? 6.2 : 5.6;
      camera.updateProjectionMatrix();
    }

    new ResizeObserver(resize).observe(container);
    window.addEventListener('resize', resize);
    resize();

    function animate() {
      requestAnimationFrame(animate);
      rotY += (targetRotY - rotY) * SMOOTH;
      rotX += (targetRotX - rotX) * SMOOTH;
      headGroup.rotation.set(
        THREE.MathUtils.degToRad(rotX),
        THREE.MathUtils.degToRad(rotY),
        0
      );
      renderer.render(scene, camera);
    }
    animate();

    // ============================================================
    // أزرار
    // ============================================================
    document.getElementById('leftBtn').addEventListener('click', () => {
      targetRotY = clamp(targetRotY - 8, -MAX_Y, MAX_Y);
    });
    document.getElementById('rightBtn').addEventListener('click', () => {
      targetRotY = clamp(targetRotY + 8, -MAX_Y, MAX_Y);
    });
    document.getElementById('upBtn').addEventListener('click', () => {
      targetRotX = clamp(targetRotX + 6, -MAX_X, MAX_X);
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      targetRotY = 0;
      targetRotX = 0;
    });

    // ============================================================
    // السحب
    // ============================================================
    container.addEventListener('pointerdown', (event) => {
      if (event.target !== renderer.domElement) return;
      dragging = true;
      startX = event.clientX;
      startY = event.clientY;
      startRotY = targetRotY;
      startRotX = targetRotX;
      container.setPointerCapture?.(event.pointerId);
      event.preventDefault();
    });

    container.addEventListener('pointermove', (event) => {
      if (!dragging) return;
      targetRotY = clamp(startRotY + (event.clientX - startX) * 0.48, -MAX_Y, MAX_Y);
      targetRotX = clamp(startRotX - (event.clientY - startY) * 0.38, -MAX_X, MAX_X);
    });

    const stopDrag = () => { dragging = false; };
    container.addEventListener('pointerup', stopDrag);
    container.addEventListener('pointercancel', stopDrag);
    container.addEventListener('lostpointercapture', stopDrag);

    // ============================================================
    // رفع الصور
    // ============================================================
    function handleUpload(file, onLoad, onError) {
      if (!file.type.startsWith('image/')) {
        onError('الرجاء اختيار ملف صورة صالح');
        return;
      }
      const image = new Image();
      image.onload = () => {
        onLoad(image);
        URL.revokeObjectURL(image.src);
      };
      image.onerror = () => {
        onError('تعذر تحميل الصورة');
        URL.revokeObjectURL(image.src);
      };
      image.src = URL.createObjectURL(file);
    }

    // رفع صورة الوجه
    faceUpload.addEventListener('change', (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      handleUpload(
        file,
        (image) => {
          facePhoto = image;
          faceStatus.textContent = '✓ جاهزة';
          faceStatus.classList.add('ready');
          paintHeadTexture();
          status.textContent = 'تم تطبيق صورة الوجه الأمامي.';
        },
        (err) => { status.textContent = err; }
      );
    });

    // رفع صورة الجوانب
    sideUpload.addEventListener('change', (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      handleUpload(
        file,
        (image) => {
          sidePhoto = image;
          sideStatus.textContent = '✓ جاهزة';
          sideStatus.classList.add('ready');
          paintHeadTexture();
          status.textContent = 'تم تطبيق صورة الجوانب.';
        },
        (err) => { status.textContent = err; }
      );
    });

    // صورة افتراضية للوجه (اختيارية)
    const sampleFace = new Image();
    sampleFace.crossOrigin = 'anonymous';
    sampleFace.onload = () => {
      if (!facePhoto) {
        facePhoto = sampleFace;
        faceStatus.textContent = 'افتراضية';
        paintHeadTexture();
      }
    };
    sampleFace.onerror = () => {};
    sampleFace.src = 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=600&auto=format&fit=crop&q=80&ixlib=rb-4.0.3';

    window.addEventListener('beforeunload', () => {
      headTexture.dispose();
      skinMaterial.dispose();
      renderer.dispose();
    });
  </script>
</body>
</html>
