<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1e2b">
  <title>رأس إنسان ثلاثي الأبعاد</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      color: #eaeef5;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: radial-gradient(ellipse at 50% 36%, #343b51 0%, #252b3b 46%, #171b26 100%);
    }
    .scene {
      width: 100%;
      max-width: 700px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
    }
    .face-container {
      position: relative;
      width: min(420px, 88vw);
      height: min(500px, 64vh);
      min-height: 360px;
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      filter: drop-shadow(0 30px 30px rgba(0,0,0,.34));
    }
    .face-container:active { cursor: grabbing; }
    .face-container canvas { display: block; width: 100%; height: 100%; outline: none; }
    .controls {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      padding: 13px 20px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 60px;
      background: rgba(20,24,33,.72);
      box-shadow: 0 15px 35px rgba(0,0,0,.36);
      backdrop-filter: blur(10px);
    }
    .controls button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 40px;
      color: #eaeef5;
      background: rgba(255,255,255,.08);
      box-shadow: 0 4px 10px rgba(0,0,0,.22);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s, transform .2s, border-color .2s;
    }
    .controls button:hover { background: rgba(255,255,255,.18); transform: scale(1.03); border-color: rgba(255,255,255,.3); }
    .controls button:active { transform: scale(.98); }
    .controls button i { font-style: normal; font-size: 1.2rem; }
    .upload-section {
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 40px;
      background: rgba(20,24,33,.72);
      box-shadow: 0 10px 25px rgba(0,0,0,.3);
      backdrop-filter: blur(10px);
    }
    .upload-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 40px;
      color: white;
      background: linear-gradient(135deg,#6a5acd,#8a7bdd);
      box-shadow: 0 4px 15px rgba(106,90,205,.38);
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }
    .upload-label:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(106,90,205,.55); }
    .upload-label input { display: none; }
    .hint {
      max-width: min(540px, 92vw);
      margin-top: 14px;
      padding: 9px 17px;
      border-radius: 30px;
      color: #b0b8c5;
      background: rgba(0,0,0,.26);
      font-size: .84rem;
      line-height: 1.6;
      text-align: center;
    }
    .status { min-height: 1.3em; margin-top: 6px; color: #d4d9e2; font-size: .8rem; text-align: center; }
    @media (max-width: 480px) {
      body { padding: 12px; }
      .face-container { height: min(460px, 59vh); min-height: 330px; }
      .controls { gap: 8px; padding: 10px 12px; }
      .controls button { padding: 9px 13px; font-size: .9rem; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="عارض رأس إنسان ثلاثي الأبعاد">
    <div class="face-container" id="faceContainer" role="img" aria-label="رأس بيضوي ثلاثي الأبعاد قابل للدوران"></div>
  </main>

  <nav class="controls" aria-label="أدوات تدوير الرأس">
    <button id="leftBtn" title="تحريك لليسار"><i>←</i> يسار</button>
    <button id="upBtn" title="إمالة الرأس"><i>↑</i> أعلى</button>
    <button id="rightBtn" title="تحريك لليمين"><i>→</i> يمين</button>
    <button id="resetBtn" title="إعادة تعيين"><i>⟲</i> إعادة</button>
  </nav>

  <section class="upload-section" aria-label="رفع صورة">
    <label class="upload-label" for="imageUpload">
      <span aria-hidden="true">📷</span> اختر صورة وجهك
      <input type="file" id="imageUpload" accept="image/*">
    </label>
  </section>
  <p class="hint">الصورة تُعرض كما هي بدون أي تعديل. المناطق الجانبية والخلفية تأخذ ألوانها من حواف الصورة تلقائياً.</p>
  <p class="status" id="status" aria-live="polite"></p>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';

    const container = document.getElementById('faceContainer');
    const upload = document.getElementById('imageUpload');
    const status = document.getElementById('status');

    // ============================================================
    // إعداد المشهد
    // ============================================================
    const scene = new THREE.Scene();
    scene.background = null;

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.02;
    container.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 50);
    camera.position.set(0, 0.05, 5.6);

    // إضاءة
    scene.add(new THREE.HemisphereLight(0xe5edff, 0x453326, 1.85));

    const keyLight = new THREE.DirectionalLight(0xffe2ca, 2.6);
    keyLight.position.set(-3.5, 4.5, 5.0);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xc6d5ff, 1.15);
    fillLight.position.set(4.0, 1.0, 3.0);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffcda9, 1.5);
    rimLight.position.set(1.5, 3.0, -3.0);
    scene.add(rimLight);

    const headGroup = new THREE.Group();
    scene.add(headGroup);

    // ============================================================
    // إعداد القماش (Canvas)
    // ============================================================
    const TEX_W = 2048;
    const TEX_H = 2048;

    const skinCanvas = document.createElement('canvas');
    skinCanvas.width = TEX_W;
    skinCanvas.height = TEX_H;
    const skinCtx = skinCanvas.getContext('2d');

    let currentPhoto = null;
    let headTexture;

    // ============================================================
    // ✅ استخراج الألوان من حواف الصورة (يمين + يسار)
    // تُستخدم لتعبئة المناطق الجانبية والخلفية
    // ============================================================
    function extractEdgeColors(image) {
      const sampleW = 256;
      const sampleH = 256;
      const sample = document.createElement('canvas');
      sample.width = sampleW;
      sample.height = sampleH;
      const ctx = sample.getContext('2d', { willReadFrequently: true });

      // رسم الصورة بحجم صغير لأخذ عينات
      ctx.drawImage(image, 0, 0, sampleW, sampleH);

      // عمود اليسار (x = 0) وعمود اليمين (x = sampleW-1)
      const leftData = ctx.getImageData(0, 0, 1, sampleH).data;
      const rightData = ctx.getImageData(sampleW - 1, 0, 1, sampleH).data;

      // تحويل كل بكسل إلى لون
      const leftColors = [];
      const rightColors = [];
      for (let i = 0; i < sampleH; i++) {
        const li = i * 4;
        leftColors.push({
          r: leftData[li],
          g: leftData[li + 1],
          b: leftData[li + 2],
          a: leftData[li + 3] / 255
        });
        rightColors.push({
          r: rightData[li],
          g: rightData[li + 1],
          b: rightData[li + 2],
          a: rightData[li + 3] / 255
        });
      }
      return { leftColors, rightColors, sampleH };
    }

    // ============================================================
    // ✅ رسم الصورة كما هي + تعبئة الجوانب بألوان الحواف
    //
    // المنهجية:
    // 1. نرسم الصورة كاملة في منتصف الـ UV أفقياً
    // 2. عمود اليسار من الصورة يُمتد نحو اليسار (streak)
    // 3. عمود اليمين من الصورة يُمتد نحو اليمين (streak)
    // 4. باقي القماش (الخلف) يأخذ متوسط ألوان الحواف
    // ============================================================
    function paintHeadTexture() {
      // تنظيف القماش
      skinCtx.clearRect(0, 0, TEX_W, TEX_H);

      if (!currentPhoto) {
        // خلفية افتراضية لون بشرة
        skinCtx.fillStyle = '#d9bfa8';
        skinCtx.fillRect(0, 0, TEX_W, TEX_H);
        if (headTexture) headTexture.needsUpdate = true;
        return;
      }

      // ✅ منطقة الصورة في UV: من u=0.25 إلى u=0.75 (النصف الأوسط)
      // هذا يضمن أن الصورة تغطي الواجهة الأمامية الكاملة للرأس
      const imgU0 = 0.25;
      const imgU1 = 0.75;
      const imgX = TEX_W * imgU0;
      const imgW = TEX_W * (imgU1 - imgU0);

      // ============================================================
      // الخطوة 1: ملء كامل القماش بلون خلفية مستخرج من الصورة
      // (متوسط ألوان العمودين الجانبيين)
      // ============================================================
      const { leftColors, rightColors, sampleH } = extractEdgeColors(currentPhoto);

      // حساب متوسط اللون
      let avgR = 0, avgG = 0, avgB = 0, count = 0;
      for (let i = 0; i < sampleH; i++) {
        const lc = leftColors[i];
        const rc = rightColors[i];
        if (lc.a > 0.1) { avgR += lc.r; avgG += lc.g; avgB += lc.b; count++; }
        if (rc.a > 0.1) { avgR += rc.r; avgG += rc.g; avgB += rc.b; count++; }
      }
      if (count === 0) { avgR = 217; avgG = 191; avgB = 168; count = 1; }
      avgR = Math.round(avgR / count);
      avgG = Math.round(avgG / count);
      avgB = Math.round(avgB / count);

      skinCtx.fillStyle = `rgb(${avgR},${avgG},${avgB})`;
      skinCtx.fillRect(0, 0, TEX_W, TEX_H);

      // ============================================================
      // الخطوة 2: ✅ رسم الصورة كما هي تماماً (بدون أي تمدد أو قص)
      // نحافظ على نسبة الأبعاد الأصلية ونضعها في منطقة الصورة
      // ============================================================
      const imgAspect = currentPhoto.width / currentPhoto.height;
      const targetAspect = imgW / TEX_H;

      let drawW, drawH, drawX, drawY;
      if (imgAspect > targetAspect) {
        // الصورة أعرض من اللازم: نُبقي العرض = imgW
        drawW = imgW;
        drawH = imgW / imgAspect;
        drawX = imgX;
        drawY = (TEX_H - drawH) / 2;
      } else {
        // الصورة أطول من اللازم: نُبقي الطول = TEX_H
        drawH = TEX_H;
        drawW = TEX_H * imgAspect;
        drawX = imgX + (imgW - drawW) / 2;
        drawY = 0;
      }

      // ✅ رسم الصورة كما هي بدون أي تعديل
      skinCtx.drawImage(
        currentPhoto,
        0, 0, currentPhoto.width, currentPhoto.height,
        drawX, drawY, drawW, drawH
      );

      // ============================================================
      // الخطوة 3: ✅ تمديد الجوانب بألوان من حواف الصورة نفسها
      // كل صف أفقي في الجانب يأخذ لونه من نفس الصف في حافة الصورة
      // ============================================================
      const sideBandW = Math.max(80, TEX_W * 0.05); // عرض شريط التمديد
      
      // شريط اليسار
      const leftBand = document.createElement('canvas');
      leftBand.width = Math.ceil(sideBandW);
      leftBand.height = TEX_H;
      const leftCtx = leftBand.getContext('2d');

      // شريط اليمين
      const rightBand = document.createElement('canvas');
      rightBand.width = Math.ceil(sideBandW);
      rightBand.height = TEX_H;
      const rightCtx = rightBand.getContext('2d');

      // نرسم الصورة مكبرة بحيث يظهر العمود الأول/الأخير فقط، ثم نمدده
      // طريقة أذكى: نرسم الصورة على الشريط بمقياس ثابت ونقصّ العمود الأول/الأخير
      
      // شريط اليسار: عمود اليسار من الصورة مكرر
      // نرسم الصورة كاملة ثم نقص العمود الأيسر فقط
      const leftTempCanvas = document.createElement('canvas');
      leftTempCanvas.width = currentPhoto.width;
      leftTempCanvas.height = currentPhoto.height;
      const leftTempCtx = leftTempCanvas.getContext('2d');
      leftTempCtx.drawImage(currentPhoto, 0, 0);

      // نأخذ العمود الأول (بكسل واحد) من الصورة الأصلية
      try {
        const leftPixelCol = leftTempCtx.getImageData(0, 0, 1, currentPhoto.height);
        const leftPixelData = leftPixelCol.data;
        
        // ننسخ هذا العمود ليصبح شريطاً كاملاً
        const bandImgData = leftCtx.createImageData(leftBand.width, leftBand.height);
        for (let y = 0; y < leftBand.height; y++) {
          const srcY = Math.floor((y / leftBand.height) * currentPhoto.height);
          const si = srcY * 4;
          const r = leftPixelData[si];
          const g = leftPixelData[si + 1];
          const b = leftPixelData[si + 2];
          
          for (let x = 0; x < leftBand.width; x++) {
            const di = (y * leftBand.width + x) * 4;
            // تلاشي تدريجي كلما ابتعدنا عن الصورة
            const fade = 1 - (x / leftBand.width) * 0.3;
            bandImgData.data[di] = Math.round(r * fade + avgR * (1 - fade));
            bandImgData.data[di + 1] = Math.round(g * fade + avgG * (1 - fade));
            bandImgData.data[di + 2] = Math.round(b * fade + avgB * (1 - fade));
            bandImgData.data[di + 3] = 255;
          }
        }
        leftCtx.putImageData(bandImgData, 0, 0);

        // شريط اليمين
        const rightPixelCol = leftTempCtx.getImageData(currentPhoto.width - 1, 0, 1, currentPhoto.height);
        const rightPixelData = rightPixelCol.data;
        
        const rightBandImgData = rightCtx.createImageData(rightBand.width, rightBand.height);
        for (let y = 0; y < rightBand.height; y++) {
          const srcY = Math.floor((y / rightBand.height) * currentPhoto.height);
          const si = srcY * 4;
          const r = rightPixelData[si];
          const g = rightPixelData[si + 1];
          const b = rightPixelData[si + 2];
          
          for (let x = 0; x < rightBand.width; x++) {
            const di = (y * rightBand.width + x) * 4;
            const fade = 1 - (x / rightBand.width) * 0.3;
            rightBandImgData.data[di] = Math.round(r * fade + avgR * (1 - fade));
            rightBandImgData.data[di + 1] = Math.round(g * fade + avgG * (1 - fade));
            rightBandImgData.data[di + 2] = Math.round(b * fade + avgB * (1 - fade));
            rightBandImgData.data[di + 3] = 255;
          }
        }
        rightCtx.putImageData(rightBandImgData, 0, 0);

        // رسم الشريطين على القماش الرئيسي
        skinCtx.drawImage(leftBand, 0, 0, sideBandW, TEX_H, 0, 0, sideBandW, TEX_H);
        skinCtx.drawImage(rightBand, 0, 0, sideBandW, TEX_H, TEX_W - sideBandW, 0, sideBandW, TEX_H);

      } catch (e) {
        // في حال فشل قراءة البكسل (CORS)، نكتفي بالخلفية المتوسطة
        console.warn('تعذر استخراج ألوان الحواف:', e);
      }

      if (headTexture) headTexture.needsUpdate = true;
    }

    headTexture = new THREE.CanvasTexture(skinCanvas);
    headTexture.colorSpace = THREE.SRGBColorSpace;
    headTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
    headTexture.wrapS = THREE.RepeatWrapping;
    headTexture.wrapT = THREE.ClampToEdgeWrapping;
    paintHeadTexture();

    // ============================================================
    // ✅ الشكل البيضوي المقلوب
    // ============================================================
    function makeHeadGeometry() {
      const around = 192;
      const vertical = 200;

      const positions = [];
      const uvs = [];
      const indices = [];

      const rx = 1.0;
      const rz = 0.78;
      const halfHeight = 1.35;

      for (let j = 0; j <= vertical; j++) {
        const v = j / vertical;
        const y = (v - 0.5) * 2 * halfHeight;
        const yn = y / halfHeight;

        let ring;
        if (yn >= 0) {
          // النصف العلوي: عريض (الجمجمة)
          ring = Math.pow(Math.max(0, 1 - yn * yn), 0.42);
        } else {
          // النصف السفلي: مدبب قليلاً (الفك)
          ring = Math.pow(Math.max(0, 1 - yn * yn), 0.62);
        }

        for (let i = 0; i <= around; i++) {
          const u = i / around;
          const theta = (u - 0.5) * Math.PI * 2;
          const s = Math.sin(theta);
          const c = Math.cos(theta);

          const x = rx * ring * s;
          let z = rz * ring * c;

          // تفاصيل الوجه
          if (c > 0) {
            const front = Math.pow(c, 5);
            const g = (cx, cy, wx, wy) =>
              Math.exp(
                -Math.pow((x - cx) / wx, 2) -
                Math.pow((y - cy) / wy, 2)
              );

            let relief = 0;
            relief += 0.028 * g(0, 0.55, 0.6, 0.35);
            relief += 0.032 * g(0, 0.10, 0.09, 0.35);
            relief += 0.052 * g(0, -0.18, 0.14, 0.14);
            relief += 0.025 * (g(-0.45, -0.05, 0.22, 0.22) + g(0.45, -0.05, 0.22, 0.22));
            relief += 0.018 * g(0, -0.75, 0.35, 0.20);
            relief -= 0.010 * (g(-0.28, 0.28, 0.17, 0.10) + g(0.28, 0.28, 0.17, 0.10));

            z += front * relief;
          }

          positions.push(x, y, z);
          uvs.push(u, v);

          if (j < vertical && i < around) {
            const a = j * (around + 1) + i;
            const b = a + around + 1;
            indices.push(a, a + 1, b, b, a + 1, b + 1);
          }
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    const skinMaterial = new THREE.MeshStandardMaterial({
      map: headTexture,
      color: 0xffffff,
      roughness: 0.82,
      metalness: 0,
      side: THREE.FrontSide
    });

    const head = new THREE.Mesh(makeHeadGeometry(), skinMaterial);
    headGroup.add(head);

    // ============================================================
    // دوران
    // ============================================================
    let rotY = 0, rotX = 0;
    let targetRotY = 0, targetRotX = 0;

    const MAX_Y = 38, MAX_X = 24;
    const SMOOTH = 0.12;
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    let dragging = false;
    let startX = 0, startY = 0;
    let startRotY = 0, startRotX = 0;

    function resize() {
      const width = Math.max(1, container.clientWidth);
      const height = Math.max(1, container.clientHeight);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.position.z = width < 360 ? 6.2 : 5.6;
      camera.updateProjectionMatrix();
    }

    new ResizeObserver(resize).observe(container);
    window.addEventListener('resize', resize);
    resize();

    function animate() {
      requestAnimationFrame(animate);
      rotY += (targetRotY - rotY) * SMOOTH;
      rotX += (targetRotX - rotX) * SMOOTH;
      headGroup.rotation.set(
        THREE.MathUtils.degToRad(rotX),
        THREE.MathUtils.degToRad(rotY),
        0
      );
      renderer.render(scene, camera);
    }
    animate();

    // ============================================================
    // أزرار التحكم
    // ============================================================
    document.getElementById('leftBtn').addEventListener('click', () => {
      targetRotY = clamp(targetRotY - 8, -MAX_Y, MAX_Y);
    });
    document.getElementById('rightBtn').addEventListener('click', () => {
      targetRotY = clamp(targetRotY + 8, -MAX_Y, MAX_Y);
    });
    document.getElementById('upBtn').addEventListener('click', () => {
      targetRotX = clamp(targetRotX + 6, -MAX_X, MAX_X);
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      targetRotY = 0;
      targetRotX = 0;
    });

    // ============================================================
    // السحب
    // ============================================================
    container.addEventListener('pointerdown', (event) => {
      if (event.target !== renderer.domElement) return;
      dragging = true;
      startX = event.clientX;
      startY = event.clientY;
      startRotY = targetRotY;
      startRotX = targetRotX;
      container.setPointerCapture?.(event.pointerId);
      event.preventDefault();
    });

    container.addEventListener('pointermove', (event) => {
      if (!dragging) return;
      targetRotY = clamp(startRotY + (event.clientX - startX) * 0.48, -MAX_Y, MAX_Y);
      targetRotX = clamp(startRotX - (event.clientY - startY) * 0.38, -MAX_X, MAX_X);
    });

    const stopDrag = () => { dragging = false; };
    container.addEventListener('pointerup', stopDrag);
    container.addEventListener('pointercancel', stopDrag);
    container.addEventListener('lostpointercapture', stopDrag);

    // ============================================================
    // رفع الصورة
    // ============================================================
    let userUploadedPhoto = false;

    upload.addEventListener('change', (event) => {
      const file = event.target.files?.[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        alert('الرجاء اختيار ملف صورة صالح');
        upload.value = '';
        return;
      }

      const image = new Image();
      image.onload = () => {
        userUploadedPhoto = true;
        currentPhoto = image;
        paintHeadTexture();
        status.textContent = 'تم تطبيق الصورة كما هي. الجوانب تأخذ ألوانها من حواف الصورة.';
        URL.revokeObjectURL(image.src);
      };
      image.onerror = () => {
        status.textContent = 'تعذر تحميل الصورة. جرّب ملف صورة آخر.';
        URL.revokeObjectURL(image.src);
      };
      image.src = URL.createObjectURL(file);
    });

    // صورة افتراضية
    const sample = new Image();
    sample.crossOrigin = 'anonymous';
    sample.onload = () => {
      if (!userUploadedPhoto) {
        currentPhoto = sample;
        paintHeadTexture();
      }
    };
    sample.onerror = () => {};
    sample.src = 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=600&auto=format&fit=crop&q=80&ixlib=rb-4.0.3';

    window.addEventListener('beforeunload', () => {
      headTexture.dispose();
      skinMaterial.dispose();
      renderer.dispose();
    });
  </script>
</body>
</html>
