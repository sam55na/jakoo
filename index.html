<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1e2b">
  <title>رأس إنسان ثلاثي الأبعاد</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      color: #eaeef5;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: radial-gradient(ellipse at 50% 36%, #343b51 0%, #252b3b 46%, #171b26 100%);
    }
    .scene {
      width: 100%;
      max-width: 700px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
    }
    .face-container {
      position: relative;
      width: min(420px, 88vw);
      height: min(500px, 64vh);
      min-height: 360px;
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      filter: drop-shadow(0 30px 30px rgba(0,0,0,.34));
    }
    .face-container:active { cursor: grabbing; }
    .face-container canvas { display: block; width: 100%; height: 100%; outline: none; }
    .controls {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      padding: 13px 20px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 60px;
      background: rgba(20,24,33,.72);
      box-shadow: 0 15px 35px rgba(0,0,0,.36);
      backdrop-filter: blur(10px);
    }
    .controls button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 40px;
      color: #eaeef5;
      background: rgba(255,255,255,.08);
      box-shadow: 0 4px 10px rgba(0,0,0,.22);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s, transform .2s, border-color .2s;
    }
    .controls button:hover { background: rgba(255,255,255,.18); transform: scale(1.03); border-color: rgba(255,255,255,.3); }
    .controls button:active { transform: scale(.98); }
    .controls button i { font-style: normal; font-size: 1.2rem; }
    .upload-section {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 40px;
      background: rgba(20,24,33,.72);
      box-shadow: 0 10px 25px rgba(0,0,0,.3);
      backdrop-filter: blur(10px);
    }
    .upload-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 40px;
      color: white;
      background: linear-gradient(135deg,#6a5acd,#8a7bdd);
      box-shadow: 0 4px 15px rgba(106,90,205,.38);
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }
    .upload-label.side {
      background: linear-gradient(135deg,#4a7a6a,#6aa08d);
      box-shadow: 0 4px 15px rgba(74,122,106,.38);
    }
    .upload-label:hover { transform: translateY(-2px); }
    .upload-label input { display: none; }
    .upload-status {
      font-size: .75rem;
      color: #9ba3b0;
      min-width: 60px;
      text-align: center;
    }
    .upload-status.ready { color: #7ed4a8; }
    .hint {
      max-width: min(580px, 92vw);
      margin-top: 14px;
      padding: 9px 17px;
      border-radius: 30px;
      color: #b0b8c5;
      background: rgba(0,0,0,.26);
      font-size: .82rem;
      line-height: 1.6;
      text-align: center;
    }
    .status { min-height: 1.3em; margin-top: 6px; color: #d4d9e2; font-size: .8rem; text-align: center; }
    @media (max-width: 480px) {
      body { padding: 12px; }
      .face-container { height: min(460px, 59vh); min-height: 330px; }
      .controls { gap: 8px; padding: 10px 12px; }
      .controls button { padding: 9px 13px; font-size: .9rem; }
      .upload-label { padding: 9px 15px; font-size: .82rem; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="عارض رأس إنسان ثلاثي الأبعاد">
    <div class="face-container" id="faceContainer" role="img" aria-label="رأس ثلاثي الأبعاد قابل للدوران"></div>
  </main>

  <nav class="controls" aria-label="أدوات تدوير الرأس">
    <button id="leftBtn" title="تحريك لليسار"><i>←</i> يسار</button>
    <button id="upBtn" title="إمالة الرأس"><i>↑</i> أعلى</button>
    <button id="rightBtn" title="تحريك لليمين"><i>→</i> يمين</button>
    <button id="resetBtn" title="إعادة تعيين"><i>⟲</i> إعادة</button>
  </nav>

  <section class="upload-section" aria-label="رفع الصور">
    <label class="upload-label" for="faceUpload">
      <span aria-hidden="true">🙂</span> صورة الوجه (PNG شفاف أفضل)
      <input type="file" id="faceUpload" accept="image/*">
    </label>
    <span class="upload-status" id="faceStatus">لم تُرفع</span>

    <label class="upload-label side" for="sideUpload">
      <span aria-hidden="true">💇</span> صورة الجوانب (اختياري)
      <input type="file" id="sideUpload" accept="image/*">
    </label>
    <span class="upload-status" id="sideStatus">اختياري</span>
  </section>

  <p class="hint">
    💡 للحصول على أفضل نتيجة: ارفع صورة PNG بخلفية شفافة. تُعرض الصورة كاملة بدون أي تكبير أو تغيير.
  </p>
  <p class="status" id="status" aria-live="polite"></p>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';

    const container = document.getElementById('faceContainer');
    const faceUpload = document.getElementById('faceUpload');
    const sideUpload = document.getElementById('sideUpload');
    const faceStatus = document.getElementById('faceStatus');
    const sideStatus = document.getElementById('sideStatus');
    const status = document.getElementById('status');

    // ============================================================
    // المشهد
    // ============================================================
    const scene = new THREE.Scene();
    scene.background = null;

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 50);
    camera.position.set(0, 0.05, 5.6);

    // إضاءة ناعمة
    scene.add(new THREE.HemisphereLight(0xe5edff, 0x453326, 2.0));

    const keyLight = new THREE.DirectionalLight(0xffe2ca, 2.6);
    keyLight.position.set(-3.5, 4.5, 5.0);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xc6d5ff, 1.2);
    fillLight.position.set(4.0, 1.0, 3.0);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffcda9, 1.6);
    rimLight.position.set(1.5, 3.0, -3.0);
    scene.add(rimLight);

    // ✅ المجموعة الرئيسية التي تحتوي على كل شيء
    const headGroup = new THREE.Group();
    scene.add(headGroup);

    // ============================================================
    // ✅ خصائص الرأس — أبعاد متناسقة
    // ============================================================
    const HEAD_W = 1.55;       // عرض الرأس
    const HEAD_H = 2.0;        // ارتفاع الرأس
    const HEAD_D = 1.15;       // عمق الرأس
    const FACE_PLANE_Z = 0.62; // مكان مستوى الوجه الأمامي (أمام المجسم)

    // ============================================================
    // ✅ 1) مجسم الجمجمة (3D) — الشكل البيضوي المقلوب
    //    هذا يعطي الحجم الحقيقي للرأس
    // ============================================================
    function makeSkullGeometry() {
      const around = 96;
      const vertical = 120;

      const positions = [];
      const uvs = [];
      const indices = [];

      // الشكل: أعلى عريض (جمجمة) + أسفل مدبب (فك)
      const rx = HEAD_W / 2;      // نصف العرض
      const rz = HEAD_D / 2;      // نصف العمق
      const ry = HEAD_H / 2;      // نصف الارتفاع

      for (let j = 0; j <= vertical; j++) {
        const v = j / vertical;
        const y = (v - 0.5) * 2 * ry;
        const yn = y / ry;

        // ✅ الشكل البيضوي المقلوب
        let ring;
        if (yn >= 0) {
          // النصف العلوي: عريض (جمجمة)
          ring = Math.pow(Math.max(0, 1 - yn * yn), 0.40);
        } else {
          // النصف السفلي: مدبب (فك)
          ring = Math.pow(Math.max(0, 1 - yn * yn), 0.65);
        }

        // ✅ إضافة تفاصيل الوجه للعمق (أنف، جبهة، فك)
        const faceBulge = (yn > -0.5 && yn < 0.7) ? 0.10 * Math.exp(-Math.pow(yn / 0.5, 2)) : 0;

        for (let i = 0; i <= around; i++) {
          const u = i / around;
          const theta = (u - 0.5) * Math.PI * 2;
          const s = Math.sin(theta);
          const c = Math.cos(theta);

          const x = rx * ring * s;
          let z = rz * ring * c;

          // نتوء أمامي (وجه)
          if (c > 0) {
            z += faceBulge * Math.pow(c, 3);
          }

          positions.push(x, y, z);
          uvs.push(u, v);

          if (j < vertical && i < around) {
            const a = j * (around + 1) + i;
            const b = a + around + 1;
            indices.push(a, a + 1, b, b, a + 1, b + 1);
          }
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    // ============================================================
    // ✅ 2) مستوى الوجه الأمامي (Plane) — يحمل الصورة كاملة
    //    منحني قليلاً ليتبع شكل الوجه
    // ============================================================
    function makeFacePlaneGeometry() {
      const widthSegments = 40;
      const heightSegments = 40;

      const positions = [];
      const uvs = [];
      const indices = [];

      const w = HEAD_W * 0.98;   // عرض المستوى
      const h = HEAD_H * 0.98;   // ارتفاع المستوى

      for (let j = 0; j <= heightSegments; j++) {
        const v = j / heightSegments;
        const y = (0.5 - v) * h;  // من +h/2 إلى -h/2 (أعلى لأسفل)
        const yn = y / (h / 2);

        for (let i = 0; i <= widthSegments; i++) {
          const u = i / widthSegments;
          const x = (u - 0.5) * w;
          const xn = x / (w / 2);

          // ✅ انحناء بسيط على شكل قوس أفقي (ليتبع استدارة الوجه)
          // وعمودي (ليتبع انحناء الجبهة/الذقن)
          const curveH = Math.sqrt(Math.max(0, 1 - xn * xn * 0.35));
          const curveV = Math.sqrt(Math.max(0, 1 - yn * yn * 0.15));

          const z = FACE_PLANE_Z * curveH * curveV;

          positions.push(x, y, z);
          uvs.push(u, 1 - v);  // 1-v لعكس الاتجاه (الصورة من الأعلى)
        }
      }

      for (let j = 0; j < heightSegments; j++) {
        for (let i = 0; i < widthSegments; i++) {
          const a = j * (widthSegments + 1) + i;
          const b = a + widthSegments + 1;
          indices.push(a, b, a + 1);
          indices.push(a + 1, b, b + 1);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    // ============================================================
    // ✅ 3) مجسم الجوانب (يحيط بالجزء الخلفي)
    // ============================================================
    function makeSideGeometry() {
      // نستخدم نفس شكل الجمجمة لكن أصغر بقليل ونعطيه إزاحة خلفية
      return makeSkullGeometry();
    }

    // ============================================================
    // مواد الجمجمة (بدون صورة) — لون بشرة رمادي داكن طبيعي
    // ============================================================
    const skullMaterial = new THREE.MeshStandardMaterial({
      color: 0x6b5a4e,
      roughness: 0.85,
      metalness: 0,
      side: THREE.FrontSide
    });

    const skull = new THREE.Mesh(makeSkullGeometry(), skullMaterial);
    headGroup.add(skull);

    // ============================================================
    // ✅ مادة الوجه — تحمل الصورة كاملة مع شفافية
    // ============================================================
    const faceMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.7,
      metalness: 0,
      transparent: true,
      alphaTest: 0.01,
      side: THREE.DoubleSide,
      depthWrite: true
    });

    // ============================================================
    // ✅ مادة الجوانب (اختيارية)
    // ============================================================
    const sideMaterial = new THREE.MeshStandardMaterial({
      color: 0x8a7565,
      roughness: 0.85,
      metalness: 0,
      transparent: true,
      side: THREE.DoubleSide
    });

    // ============================================================
    // ✅ تحميل صورة الوجه (بدون أي تعديل)
    // ============================================================
    let faceMesh = null;
    let sideMesh = null;

    function createFaceMesh(image) {
      // إزالة القديم
      if (faceMesh) {
        headGroup.remove(faceMesh);
        if (faceMesh.material.map) faceMesh.material.map.dispose();
        faceMesh.material.dispose();
        faceMesh.geometry.dispose();
      }

      // ✅ تحميل الصورة كنقش مباشر — بدون canvas وسيط
      const texture = new THREE.Texture(image);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.generateMipmaps = true;
      // ✅ مهم: الصورة تُعرض كما هي بدون قلب
      texture.flipY = true;
      texture.needsUpdate = true;

      faceMaterial.map = texture;
      faceMaterial.needsUpdate = true;

      faceMesh = new THREE.Mesh(makeFacePlaneGeometry(), faceMaterial);
      headGroup.add(faceMesh);
    }

    function createSideMesh(image) {
      if (sideMesh) {
        headGroup.remove(sideMesh);
        if (sideMesh.material.map) sideMesh.material.map.dispose();
        sideMesh.material.dispose();
        sideMesh.geometry.dispose();
      }

      const texture = new THREE.Texture(image);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      texture.flipY = true;
      texture.needsUpdate = true;

      sideMaterial.map = texture;
      sideMaterial.color.set(0xffffff);
      sideMaterial.needsUpdate = true;

      sideMesh = new THREE.Mesh(makeSideGeometry(), sideMaterial);
      // الجوانب أكبر بقليل من الجمجمة لتغطيها
      sideMesh.scale.set(1.02, 1.02, 1.02);
      headGroup.add(sideMesh);
    }

    // ============================================================
    // دوران
    // ============================================================
    let rotY = 0, rotX = 0;
    let targetRotY = 0, targetRotX = 0;

    const MAX_Y = 38, MAX_X = 24;
    const SMOOTH = 0.12;
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    let dragging = false;
    let startX = 0, startY = 0;
    let startRotY = 0, startRotX = 0;

    function resize() {
      const width = Math.max(1, container.clientWidth);
      const height = Math.max(1, container.clientHeight);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.position.z = width < 360 ? 6.2 : 5.6;
      camera.updateProjectionMatrix();
    }

    new ResizeObserver(resize).observe(container);
    window.addEventListener('resize', resize);
    resize();

    function animate() {
      requestAnimationFrame(animate);
      rotY += (targetRotY - rotY) * SMOOTH;
      rotX += (targetRotX - rotX) * SMOOTH;
      headGroup.rotation.set(
        THREE.MathUtils.degToRad(rotX),
        THREE.MathUtils.degToRad(rotY),
        0
      );
      renderer.render(scene, camera);
    }
    animate();

    // أزرار
    document.getElementById('leftBtn').addEventListener('click', () => {
      targetRotY = clamp(targetRotY - 8, -MAX_Y, MAX_Y);
    });
    document.getElementById('rightBtn').addEventListener('click', () => {
      targetRotY = clamp(targetRotY + 8, -MAX_Y, MAX_Y);
    });
    document.getElementById('upBtn').addEventListener('click', () => {
      targetRotX = clamp(targetRotX + 6, -MAX_X, MAX_X);
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      targetRotY = 0;
      targetRotX = 0;
    });

    // السحب
    container.addEventListener('pointerdown', (event) => {
      if (event.target !== renderer.domElement) return;
      dragging = true;
      startX = event.clientX;
      startY = event.clientY;
      startRotY = targetRotY;
      startRotX = targetRotX;
      container.setPointerCapture?.(event.pointerId);
      event.preventDefault();
    });

    container.addEventListener('pointermove', (event) => {
      if (!dragging) return;
      targetRotY = clamp(startRotY + (event.clientX - startX) * 0.48, -MAX_Y, MAX_Y);
      targetRotX = clamp(startRotX - (event.clientY - startY) * 0.38, -MAX_X, MAX_X);
    });

    const stopDrag = () => { dragging = false; };
    container.addEventListener('pointerup', stopDrag);
    container.addEventListener('pointercancel', stopDrag);
    container.addEventListener('lostpointercapture', stopDrag);

    // رفع الصور
    function handleUpload(file, onLoad, onError) {
      if (!file.type.startsWith('image/')) {
        onError('الرجاء اختيار ملف صورة صالح');
        return;
      }
      const image = new Image();
      image.onload = () => {
        onLoad(image);
        URL.revokeObjectURL(image.src);
      };
      image.onerror = () => {
        onError('تعذر تحميل الصورة');
        URL.revokeObjectURL(image.src);
      };
      image.src = URL.createObjectURL(file);
    }

    faceUpload.addEventListener('change', (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      handleUpload(
        file,
        (image) => {
          createFaceMesh(image);
          faceStatus.textContent = '✓ جاهزة';
          faceStatus.classList.add('ready');
          status.textContent = 'تم تطبيق صورة الوجه كاملة. اسحب لرؤية الجوانب.';
        },
        (err) => { status.textContent = err; }
      );
    });

    sideUpload.addEventListener('change', (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      handleUpload(
        file,
        (image) => {
          createSideMesh(image);
          sideStatus.textContent = '✓ جاهزة';
          sideStatus.classList.add('ready');
          status.textContent = 'تم تطبيق صورة الجوانب.';
        },
        (err) => { status.textContent = err; }
      );
    });

    window.addEventListener('beforeunload', () => {
      if (faceMesh) {
        if (faceMesh.material.map) faceMesh.material.map.dispose();
        faceMesh.material.dispose();
        faceMesh.geometry.dispose();
      }
      skullMaterial.dispose();
      renderer.dispose();
    });
  </script>
</body>
</html>
